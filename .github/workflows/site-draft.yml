name: Site draft

# Three offline checks on the site generated on the shared template (baseline).
# The workflow and its job keep the names they had while the site was staged at
# site/draft/, so the names of the checks stay the same.
#
# The first verifies that every baseline file copied into site/assets/baseline/
# still matches .baseline/pin.toml and the version's published SHA256SUMS, so a
# copied file is never edited, that the pin's version is the one the version's
# README (kept unserved in .baseline/) names, and that NOTICE.md carries the
# README's Site template entry for it. See tools/check-baseline-pin.py for scope.
#
# The second verifies that the committed site/ is exactly what
# tools/build-site.py generates from site-src/ and the skill's own files, beside
# only the static files that site-src/site.json lists, that every internal link
# resolves, and that every page keeps the template's refusals (no dash, no inline
# code, noindex on the 404 and draft holding pages). See tools/build-site.py for
# scope.
#
# The third runs the baseline's pinned palette contrast gate,
# .baseline/check_palette.py, after checking its pin, through
# tools/check-palette.py. See that tool for scope.
#
# This workflow carries no paths filter on purpose, as sitemap.yml explains: a
# path-filtered required check never reports on a pull request outside its
# paths, and the generated pages depend on files across the repository.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run the baseline pin gate tests
        shell: bash
        run: python3 -I tools/test-baseline-pin.py

      - name: Check the copied baseline files against the pin
        shell: bash
        run: python3 -I tools/check-baseline-pin.py

      - name: Run the site generator tests
        shell: bash
        run: python3 -I tools/test-build-site.py

      - name: Check the committed site matches a fresh build
        shell: bash
        run: python3 -I tools/build-site.py --check

      - name: Run the palette gate tests
        shell: bash
        run: python3 -I tools/test-check-palette.py

      - name: Check the palette contrast
        shell: bash
        run: python3 -I tools/check-palette.py
