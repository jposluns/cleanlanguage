name: Install page

# Checks that the install page keeps its five AI-family setup sections static,
# visible, and complete, so the progressive-enhancement family selector in
# site/assets/baseline/select.js stays an enhancement. With JavaScript blocked by the site's
# rules, failed, or disabled, no family section may disappear. See
# tools/check-install-page.py for what it proves and does not prove.

on:
  pull_request:
    paths:
      - "site/install/index.html"
      - "site/_headers"
      - "tools/check-install-page.py"
      - "tools/check-headers.py"
      - "tools/check-inline-code.py"
      - "tools/test-install-page.py"
      - ".github/workflows/install-page.yml"
  push:
    branches:
      - main
    paths:
      - "site/install/index.html"
      - "site/_headers"
      - "tools/check-install-page.py"
      - "tools/check-headers.py"
      - "tools/check-inline-code.py"
      - "tools/test-install-page.py"
      - ".github/workflows/install-page.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run the install page gate tests
        shell: bash
        run: python3 -I tools/test-install-page.py

      - name: Check the install page stays static and complete
        shell: bash
        run: python3 -I tools/check-install-page.py
