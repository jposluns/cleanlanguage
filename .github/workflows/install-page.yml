name: Install page

# Checks that the install page links each AI family's setup page with visible
# buttons, and that each family page keeps its setup steps static, visible, and
# complete, with no script involved. See tools/check-install-page.py for what it
# proves and does not prove.

on:
  pull_request:
    paths:
      - "site/install/**"
      - "site/**"
      - "site/_headers"
      - "site/_redirects"
      - "site/_worker.js"
      - "site/_worker.js/**"
      - "functions"
      - "functions/**"
      - "wrangler.toml"
      - "wrangler.toml/**"
      - "wrangler.json"
      - "wrangler.json/**"
      - "wrangler.jsonc"
      - "wrangler.jsonc/**"
      - "package.json"
      - "package.json/**"
      - "runtime.txt"
      - "runtime.txt/**"
      - "requirements.txt"
      - "requirements.txt/**"
      - "Pipfile"
      - "Pipfile/**"
      - "Gemfile"
      - "Gemfile/**"
      - "site/assets/baseline/*.css"
      - ".baseline/pin.toml"
      - "tools/check-install-page.py"
      - "tools/check-headers.py"
      - "tools/check-inline-code.py"
      - "tools/check-baseline-pin.py"
      - "tools/test-install-page.py"
      - "tools/install-page-rules.txt"
      - "tools/check-python-version.py"
      - ".python-version"
      - ".github/workflows/install-page.yml"
  push:
    branches:
      - main
    paths:
      - "site/install/**"
      - "site/**"
      - "site/_headers"
      - "site/_redirects"
      - "site/_worker.js"
      - "site/_worker.js/**"
      - "functions"
      - "functions/**"
      - "wrangler.toml"
      - "wrangler.toml/**"
      - "wrangler.json"
      - "wrangler.json/**"
      - "wrangler.jsonc"
      - "wrangler.jsonc/**"
      - "package.json"
      - "package.json/**"
      - "runtime.txt"
      - "runtime.txt/**"
      - "requirements.txt"
      - "requirements.txt/**"
      - "Pipfile"
      - "Pipfile/**"
      - "Gemfile"
      - "Gemfile/**"
      - "site/assets/baseline/*.css"
      - ".baseline/pin.toml"
      - "tools/check-install-page.py"
      - "tools/check-headers.py"
      - "tools/check-inline-code.py"
      - "tools/check-baseline-pin.py"
      - "tools/test-install-page.py"
      - "tools/install-page-rules.txt"
      - "tools/check-python-version.py"
      - ".python-version"
      - ".github/workflows/install-page.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check that python3 is the release that .python-version names
        shell: bash
        run: python3 -I tools/check-python-version.py

      - name: Run the install page gate tests
        shell: bash
        run: python3 -I tools/test-install-page.py

      - name: Check the install pages stay static and complete
        shell: bash
        run: python3 -I tools/check-install-page.py
