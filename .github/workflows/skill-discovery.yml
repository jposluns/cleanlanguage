name: Skill discovery

# Verify that the skill stays discoverable through its manifests, so a rename,
# relocation, or metadata drift cannot reach main. Structural, offline, and
# fail-closed; also runs the gate's own unit tests.
#
# Neither trigger carries a paths filter, so this gate reports on every pull
# request and on every push to main and can be a required check: a
# path-filtered required check never reports on a pull request outside its
# paths and blocks the merge as forever-pending. tools/ci-status.sh insists on
# this check by its display name, so a main commit without a run of it would
# read as pending; the push trigger therefore runs on every push to main too.
# tools/test-ci-status.sh fails if a paths filter returns here.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    # A unique display name, so a required status check names this job alone
    # and no other workflow job called check can satisfy it.
    name: Skill discovery
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run the skill-discovery tests
        shell: bash
        run: python3 tools/test-skill-discovery.py
      - name: Validate skill discovery
        shell: bash
        run: python3 tools/check-skill-discovery.py
