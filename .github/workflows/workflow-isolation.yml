name: Workflow launch isolation

# Checks that every Python launch in .github/workflows runs isolated, with
# the -I option, so a file beside a script cannot shadow a standard-library
# import and no PYTHON* environment variable steers the run, and that a file
# planted beside a script that imports a sibling cannot run. See
# tools/test-workflow-launch-isolation.py for scope and residuals.
#
# This workflow carries no paths filter on purpose, as sitemap.yml explains: a
# path-filtered required check never reports on a pull request outside its
# paths. The scan also reads the launch lines below.
#
# The second step runs tools/test-portable-text-sync-workflow.py, which fails
# if a paths or paths-ignore filter comes back on portable-text-sync.yml or on
# this workflow. portable-text-sync.yml also runs it, but a pull request that
# adds a filter to that workflow which its own changed files fall outside never
# starts that run, so the test runs here as well.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check every Python launch in the workflows runs isolated
        shell: bash
        run: python3 -I tools/test-workflow-launch-isolation.py

      - name: Check the portable text sync triggers carry no path filter
        shell: bash
        run: python3 -I tools/test-portable-text-sync-workflow.py
