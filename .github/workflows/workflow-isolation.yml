name: Workflow launch isolation

# Checks that every Python launch in .github/workflows runs isolated, with the
# -I option, so a file beside a script cannot shadow a standard-library import
# and no PYTHON* environment variable steers the run, and that a file planted
# beside a script that imports a sibling cannot run. See
# tools/test-workflow-launch-isolation.py for scope and residuals. The fourth
# step runs tools/test-shell-launch-isolation.py, which checks that, in the
# shell scripts the workflows run, each python or pypy word and each .py or
# .pyz token on a line the scan reads stands in text that reads as a python3
# -I launch, apart from the lines its exception table names. A .py or .pyz
# token may instead be the first word after a call, at the start of a line, of
# a function that its LAUNCHERS table names and whose definition it checks;
# the 6 gate lines of tools/pages-build.sh pass that way. It reads text, so
# such text passes even where nothing runs it, and it does not check for a
# planted sibling. See that scan for its scope and residuals.
#
# This workflow carries no paths filter on purpose, as sitemap.yml explains: a
# path-filtered required check never reports on a pull request outside its
# paths. The scan also reads the launch lines below.
#
# The third step runs tools/test-portable-text-sync-workflow.py, which fails
# if the triggers of portable-text-sync.yml or of this workflow are anything
# but a bare pull_request and a push on main, so a paths or paths-ignore
# filter on either fails, and fails unless each of those 2 workflows holds
# exactly 1 step that runs the test, with no key but name, shell and run,
# in a job with no if:. It also fails unless the triggers of
# release-dry-run.yml are exactly a bare pull_request, a push on main and a
# bare workflow_dispatch, and that workflow has exactly 1 job, dry-run,
# whose timeout-minutes is the integer 30, with no if: or continue-on-error
# on that job and no if:, continue-on-error or timeout-minutes on any of its
# steps. See that test for what it does not catch. portable-text-sync.yml
# also runs it, but a pull request that adds a filter to that workflow which
# its own changed files fall outside never starts that run, so the test runs
# here as well. release-dry-run.yml does not run the test, so this run and
# the one in portable-text-sync.yml catch a filter, a changed time limit or
# such a key there.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check every Python launch in the workflows runs isolated
        shell: bash
        run: python3 -I tools/test-workflow-launch-isolation.py

      - name: Check the portable text sync, release dry run and this workflow's triggers, and the dry run's limits and conditions
        shell: bash
        run: python3 -I tools/test-portable-text-sync-workflow.py

      - name: Check that each python or pypy word and .py or .pyz token on a line the scan reads in the workflows' shell scripts stands in text that reads as a python3 -I launch, or that the token is the first word after a call of a launcher function the scan checks, apart from named exceptions
        shell: bash
        run: python3 -I tools/test-shell-launch-isolation.py
