name: Workflow launch isolation

# Checks that every Python launch in .github/workflows runs isolated
# (python3 -I), so a file beside a script cannot shadow a standard-library
# import and no PYTHON* environment variable steers the run, and that a file
# planted beside a script that imports a sibling cannot run. See
# tools/test-workflow-launch-isolation.py for scope and residuals.
#
# This workflow carries no paths filter on purpose, as sitemap.yml explains: a
# path-filtered required check never reports on a pull request outside its
# paths. The scan also runs on its own launch line below.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check every Python launch in the workflows runs isolated
        shell: bash
        run: python3 -I tools/test-workflow-launch-isolation.py
