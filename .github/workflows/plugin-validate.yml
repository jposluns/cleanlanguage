name: Plugin manifests

# Validate the plugin manifests so a malformed manifest cannot reach main. Three
# checks run, because none covers the others:
#
#   1. `claude plugin validate .` reads .claude-plugin/marketplace.json and, because
#      that manifest's plugin entry uses `source: "./cleanlanguage"`, recurses into
#      cleanlanguage/.claude-plugin/plugin.json. A missing name or a skills path
#      pointing nowhere fails here.
#   2. `claude plugin validate ./cleanlanguage` validates the exact directory a
#      marketplace install copies, so the plugin stays valid even if a CLI release
#      changes how marketplace validation recurses into plugin sources.
#   3. The skill's own frontmatter is read by NEITHER of those runs. The validator
#      only performs the frontmatter pass when the holding directory is named
#      `skills`, so the skill is staged into one and validated there. `--strict` is
#      load-bearing: a missing frontmatter block is reported as a WARNING, and
#      without --strict the step exits 0 and proves nothing.
#
# The CLI version is PINNED. The repository pins actions/checkout to a commit SHA
# for the same reason: a dependency release must not red an unrelated pull request,
# and a given commit should validate the same way months from now. The cost of a pin
# is that it goes stale, and a stale validator produces a FALSE GREEN while users
# install with current versions. That risk is covered by plugin-drift.yml, which runs
# the same checks against the current release on a schedule.
#
# No paths filter, deliberately. A path-filtered required check never reports on a
# pull request outside its paths and blocks the merge as forever-pending, so keeping
# this unfiltered leaves it promotable to a required check.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.261"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned Claude Code CLI
        shell: bash
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Report the CLI version actually installed
        shell: bash
        run: claude --version

      - name: Validate the marketplace and plugin manifests
        shell: bash
        run: claude plugin validate . --strict

      - name: Validate the plugin directory an install copies
        shell: bash
        run: claude plugin validate ./cleanlanguage --strict

      - name: Validate the skill frontmatter through a staged skills directory
        shell: bash
        run: |
          set -euo pipefail
          staged="$(mktemp -d)"
          mkdir -p "${staged}/skills"
          cp -r cleanlanguage/skills/cleanlanguage "${staged}/skills/cleanlanguage"
          claude plugin validate "${staged}/skills" --strict
