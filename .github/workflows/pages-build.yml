name: Pages build

# Run the Cloudflare Pages build command, tools/pages-build.sh, the same
# command Pages runs: the owner's 5 offline integrity gates on a shallow
# checkout, no gate reaching the network or git history. The first step runs
# the script's tests, which fail if the script stops running a listed gate or
# stops failing when a gate exits 1 or 3; the second runs the script itself.
# On a pull request this proves the dashboard command and its gate list
# before merge.
# It runs on the GitHub runner's python3, not in the Pages build image, so it
# does not prove the image; on a push to main it runs alongside Pages.
#
# This workflow carries no paths filter on purpose, as sitemap.yml explains: a
# path-filtered required check never reports on a pull request outside its
# paths, and the gates read files across the repository. The checkout stays
# shallow, so a gate that starts to need git history, and fails when that
# history is missing, fails here on the pull request, before merge.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run the Pages build script tests
        shell: bash
        run: python3 -I tools/test-pages-build.py

      - name: Run the Pages build command
        shell: bash
        run: bash tools/pages-build.sh
