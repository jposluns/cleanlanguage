name: Release Clean Language Skill

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.0.2"
        required: true
        type: string
      force:
        description: "Overwrite the tag even if it already has a published release. Leave unchecked; a published version should not be republished with different bytes."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read and validate the version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' cleanlanguage/SKILL.md | head -1)"
          if [ -z "${version}" ]; then
            echo "No 'Version:' line found in the cleanlanguage/SKILL.md body." >&2
            exit 1
          fi
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "SKILL.md version (${version}) does not match the release tag (${RELEASE_TAG})." >&2
            echo "Set the Version line in cleanlanguage/SKILL.md to match the tag, or cut the matching tag." >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "Releasing version ${version} as ${RELEASE_TAG}."

      - name: Validate skill structure
        shell: bash
        run: |
          set -euo pipefail
          test -f cleanlanguage/SKILL.md
          test -d cleanlanguage/references
          grep -Eq '^name:[[:space:]]*cleanlanguage[[:space:]]*$' cleanlanguage/SKILL.md
          if find cleanlanguage -type f \( -name '*.py' -o -name '*.js' -o -name '*.sh' -o -name '*.exe' -o -name '*.dll' \) | grep -q .; then
            echo "Unexpected executable or script content found in the skill package."
            exit 1
          fi
          # Any icon the ChatGPT interface config references must exist in the package,
          # so a shipped skill never points at a missing asset.
          if [ -f cleanlanguage/agents/openai.yaml ]; then
            missing_icon=0
            while IFS= read -r icon; do
              [ -n "${icon}" ] || continue
              if [ ! -f "cleanlanguage/${icon#./}" ]; then
                echo "Icon referenced in agents/openai.yaml is missing: ${icon}"
                missing_icon=1
              fi
            done < <(sed -n 's/.*icon_[a-z]*:[[:space:]]*"\(\.\/[^"]*\)".*/\1/p' cleanlanguage/agents/openai.yaml)
            test "${missing_icon}" -eq 0
          fi

      - name: Package the skill as a ZIP and checksum it
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          zip -r -X dist/cleanlanguage.zip \
            cleanlanguage/SKILL.md \
            cleanlanguage/references \
            cleanlanguage/agents \
            cleanlanguage/assets \
            -x '*/.DS_Store' '*/__MACOSX/*' '*/.git*'
          # A byte-identical, version-named copy for the releases archive. The
          # stable cleanlanguage.zip stays the always-latest download; every
          # release also keeps its own cleanlanguage-<version>.zip.
          cp dist/cleanlanguage.zip "dist/cleanlanguage-${VERSION}.zip"
          cd dist
          sha256sum cleanlanguage.zip > cleanlanguage.zip.sha256
          sha256sum "cleanlanguage-${VERSION}.zip" > "cleanlanguage-${VERSION}.zip.sha256"

      - name: Verify archive layout
        shell: bash
        run: |
          set -euo pipefail
          entries=$(unzip -Z1 dist/cleanlanguage.zip)
          echo "${entries}"
          top=$(printf '%s\n' "${entries}" | cut -d/ -f1 | sort -u)
          test "${top}" = "cleanlanguage"
          printf '%s\n' "${entries}" | grep -qx 'cleanlanguage/SKILL.md'
          printf '%s\n' "${entries}" | grep -q '^cleanlanguage/references/'
          if printf '%s\n' "${entries}" | grep -qiE 'DS_Store|__MACOSX|/\.git'; then
            echo "Unexpected artefact found in archive."
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          # A manual dispatch releases the checked-out commit under RELEASE_TAG.
          # It refuses to move a tag that already has a published release, so a
          # published, checksummed version is never quietly replaced with
          # different bytes. Cut a new version instead, or set the force input to
          # overwrite deliberately. A tag push leaves the tag where it was pushed.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              if [ "${FORCE}" != "true" ]; then
                echo "Release ${RELEASE_TAG} already exists." >&2
                echo "Republishing different bytes under a published version would break its checksum as a trust signal." >&2
                echo "Cut a new version, or re-run with the force input enabled to overwrite ${RELEASE_TAG} deliberately." >&2
                exit 1
              fi
              echo "force is enabled; moving published tag ${RELEASE_TAG} to ${GITHUB_SHA}."
            fi
            git tag -f "${RELEASE_TAG}" "${GITHUB_SHA}"
            git push --force origin "refs/tags/${RELEASE_TAG}"
          elif ! git rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/cleanlanguage.zip \
              dist/cleanlanguage.zip.sha256 \
              "dist/cleanlanguage-${VERSION}.zip" \
              "dist/cleanlanguage-${VERSION}.zip.sha256" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              dist/cleanlanguage.zip \
              dist/cleanlanguage.zip.sha256 \
              "dist/cleanlanguage-${VERSION}.zip" \
              "dist/cleanlanguage-${VERSION}.zip.sha256" \
              --title "Clean Language ${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Point the site downloads at this release
        shell: bash
        run: |
          set -euo pipefail
          # The site's download buttons serve the version-named zip so repeat
          # downloads stay distinguishable in the user's Downloads folder. Each
          # release rewrites the redirect targets and pushes the one-file commit
          # to main, which redeploys the site.
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          {
            printf '%s\n' "/claude/download ${base}/cleanlanguage-${VERSION}.zip 302"
            printf '%s\n' "/download ${base}/cleanlanguage-${VERSION}.zip 302"
            printf '%s\n' "/download/checksum ${base}/cleanlanguage-${VERSION}.zip.sha256 302"
            printf '%s\n' "/downloads/clean-language-instructions.txt /downloads/cleanlanguage-instructions.txt 301"
          } > site/_redirects
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/_redirects
          if git diff --cached --quiet; then
            echo "Redirects already point at ${RELEASE_TAG}."
            exit 0
          fi
          git commit -m "Point the site downloads at ${RELEASE_TAG}"
          git push origin HEAD:main || (git pull --rebase origin main && git push origin HEAD:main)