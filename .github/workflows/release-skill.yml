name: Release Clean Language Skill

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.0.2"
        required: true
        type: string
      force:
        description: "Overwrite an already published release and move its tag to this commit. This changes published bytes and checksums; leave it unchecked. To finish a partly failed release, re-run this workflow with the tag itself selected as the run ref, not main."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  # tools/ci-status.sh reads the Check Runs API on the site pull request.
  checks: read

concurrency:
  # Serialize releases for a tag so two runs cannot interleave the tag, the
  # release, and the site steps. A release in progress is never cancelled.
  group: release-skill-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the site pull request step runs check-page-metadata.py
          # before opening the PR, and that check reads each page's history.
          fetch-depth: 0

      - name: Read and validate the version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' cleanlanguage/SKILL.md | head -1)"
          if [ -z "${version}" ]; then
            echo "No 'Version:' line found in the cleanlanguage/SKILL.md body." >&2
            exit 1
          fi
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "SKILL.md version (${version}) does not match the release tag (${RELEASE_TAG})." >&2
            echo "Set the Version line in cleanlanguage/SKILL.md to match the tag, or cut the matching tag." >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "Releasing version ${version} as ${RELEASE_TAG}."

      - name: Validate, package, and verify the skill zip
        shell: bash
        run: tools/release-package.sh --tag "${RELEASE_TAG}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          # A published release is immutable: its checksum is a trust signal,
          # so its bytes never change except by a deliberate manual dispatch
          # with the force input. Probe the release through the API so a
          # transient error fails closed rather than reading as "no release".
          response="$(mktemp)"
          set +e
          gh api --include --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >"${response}" 2>&1
          set -e
          # --silent drops the body, so only headers are scanned; match a real
          # status line and keep the last one, after any redirects.
          status="$(awk '$1 ~ /^HTTP\/[0-9.]+$/ { code=$2 } END { print code }' "${response}")"
          rm -f "${response}"
          case "${status}" in
            200) release_exists=1 ;;
            404) release_exists=0 ;;
            *)
              echo "Could not determine whether ${RELEASE_TAG} is already published (HTTP ${status:-none})." >&2
              echo "Refusing to proceed rather than risk overwriting a published release." >&2
              exit 1
              ;;
          esac
          # Resolve the remote tag on its own, preferring the peeled commit
          # line (^{}) explicitly so an annotated tag resolves to its commit
          # regardless of output order. Tag moves are governed independently.
          remote_tag_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" "refs/tags/${RELEASE_TAG}" | awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { plain=$1 } END { print (peeled != "" ? peeled : plain) }')"
          if [ "${release_exists}" -eq 1 ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${FORCE}" = "true" ]; then
              echo "force is enabled; overwriting the published release ${RELEASE_TAG}."
            elif [ "${remote_tag_sha}" = "${GITHUB_SHA}" ]; then
              # A re-run at the same commit: keep the published assets rather
              # than re-uploading (which would change their checksum). Require
              # the four expected assets to be present, then take the published
              # checksum files so the site step displays the checksum of the
              # published bytes, not a fresh local build.
              published_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
              for asset in cleanlanguage.zip cleanlanguage.zip.sha256 "cleanlanguage-${VERSION}.zip" "cleanlanguage-${VERSION}.zip.sha256"; do
                printf '%s\n' "${published_assets}" | grep -qx "${asset}" || {
                  echo "Published release ${RELEASE_TAG} is missing the asset ${asset}." >&2
                  echo "Republish deliberately with a manual dispatch and the force input." >&2
                  exit 1
                }
              done
              gh release download "${RELEASE_TAG}" --dir dist --clobber \
                --pattern "cleanlanguage.zip.sha256" \
                --pattern "cleanlanguage-${VERSION}.zip.sha256"
              echo "Release ${RELEASE_TAG} is already published at ${GITHUB_SHA}; kept its assets and took its published checksum. Continuing to the site step."
              exit 0
            else
              echo "Release ${RELEASE_TAG} is already published, but its tag now resolves to ${remote_tag_sha:-nothing}, not ${GITHUB_SHA}." >&2
              echo "Republishing different bytes under a published version would break its checksum as a trust signal." >&2
              echo "Cut a new version, or run this workflow manually with the force input to overwrite ${RELEASE_TAG} deliberately (select the tag as the run ref)." >&2
              exit 1
            fi
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -z "${remote_tag_sha}" ]; then
              git tag "${RELEASE_TAG}" "${GITHUB_SHA}"
              git push origin "refs/tags/${RELEASE_TAG}"
            elif [ "${remote_tag_sha}" = "${GITHUB_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} already points at ${GITHUB_SHA}; leaving it in place."
            elif [ "${FORCE}" = "true" ]; then
              echo "force is enabled; moving ${RELEASE_TAG} to ${GITHUB_SHA}."
              git tag -f "${RELEASE_TAG}" "${GITHUB_SHA}"
              git push --force origin "refs/tags/${RELEASE_TAG}"
            else
              echo "Tag ${RELEASE_TAG} already points at ${remote_tag_sha}, not ${GITHUB_SHA}; refusing to move it without the force input." >&2
              exit 1
            fi
          else
            # Tag push: the tag must still resolve to the built commit, or a
            # concurrent move would publish one commit's bytes under another.
            if [ "${remote_tag_sha}" != "${GITHUB_SHA}" ]; then
              echo "Tag ${RELEASE_TAG} resolves to ${remote_tag_sha:-nothing} on origin, not the built commit ${GITHUB_SHA}; refusing to publish mismatched bytes." >&2
              exit 1
            fi
          fi
          if [ "${release_exists}" -eq 1 ]; then
            gh release upload "${RELEASE_TAG}" \
              dist/cleanlanguage.zip \
              dist/cleanlanguage.zip.sha256 \
              "dist/cleanlanguage-${VERSION}.zip" \
              "dist/cleanlanguage-${VERSION}.zip.sha256" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" --verify-tag \
              dist/cleanlanguage.zip \
              dist/cleanlanguage.zip.sha256 \
              "dist/cleanlanguage-${VERSION}.zip" \
              "dist/cleanlanguage-${VERSION}.zip.sha256" \
              --title "Clean Language ${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Point the site downloads at this release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The site's download buttons serve the version-named zip so repeat
          # downloads stay distinguishable in the user's Downloads folder. Main
          # only accepts changes through a pull request, so the redirect flip
          # ships as a PR this step opens and merges once the checks pass.
          # Store a token with contents and pull-requests write access as the
          # RELEASE_PR_TOKEN secret; without it the step falls back to the
          # built-in token, whose PRs do not trigger pull_request workflows
          # (the required Cloudflare Pages check still runs either way).
          # The site links straight at the version-named assets, so the version
          # lives in the pages as well as in the redirects. set-release-links.py
          # writes every place at once and check-release-links.py verifies the
          # result, so this step cannot quietly disagree with the gate.
          checksum="$(cut -d' ' -f1 < "dist/cleanlanguage-${VERSION}.zip.sha256")"
          # One UTC date drives both the page stamps and the site commit, so a
          # release crossing midnight cannot stamp one date and commit the next,
          # which would fail the page-metadata gate on the pull request.
          site_date="$(date -u +%F)"
          tools/set-release-links.py --version "${VERSION}" --tag "${RELEASE_TAG}" --checksum "${checksum}" --date "${site_date}"
          tools/check-release-links.py
          python3 tools/check-page-metadata.py
          if git diff --quiet -- site; then
            echo "The site already points at ${RELEASE_TAG}."
            exit 0
          fi
          branch="release-redirects-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}"
          git add site
          GIT_AUTHOR_DATE="${site_date}T12:00:00Z" GIT_COMMITTER_DATE="${site_date}T12:00:00Z" \
            git commit -m "Point the site downloads at ${RELEASE_TAG}"
          git push --force origin "HEAD:${branch}"
          # Reuse an open pull request for this branch if a previous run opened
          # one, so a re-run finishes rather than failing on a duplicate.
          pr_url="$(gh pr list --head "${branch}" --base main --state open --json url --jq '.[0].url // empty')"
          if [ -z "${pr_url}" ]; then
            pr_url="$(gh pr create --base main --head "${branch}" \
              --title "Point the site downloads at ${RELEASE_TAG}" \
              --body "Automated for the ${RELEASE_TAG} release: the download buttons, the redirects, and the published checksum on the verify page now name the ${RELEASE_TAG} assets.")"
            echo "Opened ${pr_url}"
          else
            echo "Reusing the open pull request ${pr_url}."
          fi
          sleep 20
          tools/ci-status.sh "$(git rev-parse HEAD)" --wait --repo "${GITHUB_REPOSITORY}"
          gh pr merge "${pr_url}" --squash --delete-branch
          echo "Merged ${pr_url}"