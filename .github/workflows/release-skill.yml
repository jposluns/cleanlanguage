name: Release Clean Language Skill

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.0.2"
        required: true
        type: string
      force:
        description: "Move the tag of a release that is not yet published to this commit. A published release is immutable and cannot be republished, so this input never overwrites one; the remedy for a published release is a corrective new version. Leave it unchecked. To finish a run that failed before it published, dispatch this workflow again with the tag itself selected as the run ref, not main; the re-run button keeps the original run ref and inputs."
        required: false
        default: false
        type: boolean

permissions:
  # The workflow builds, checksums, and publishes the release only. It never
  # opens a pull request: matching the rest of the fleet, the orchestrator
  # performs the post-release site checksum flip out of band under a user
  # token, so no pull-requests or checks permission is needed here.
  contents: write

concurrency:
  # Serialize releases for a tag so two runs cannot interleave the tag and the
  # release. A release in progress is never cancelled.
  group: release-skill-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so release-package.sh can read the commit timestamp it
          # stamps into the zip, and the version precondition below can compare
          # against main.
          fetch-depth: 0

      - name: Read and validate the version
        shell: bash
        run: |
          set -euo pipefail
          # The first Version: line is authoritative and must be a bare X.Y.Z,
          # the same strict rule the release gates apply; a malformed first line
          # is rejected, never skipped to a later matching line. One shared strict
          # extractor, tools/skill-version.py, reads and validates it for every
          # site, so the workflow, the dry run, and the Python gates agree byte
          # for byte (including on a NUL, which the old capture-then-sed form
          # stripped). skill-version.py reads the whole file, so there is no
          # early-quit pipe and no SIGPIPE on a large blob.
          if ! version="$(python3 tools/skill-version.py cleanlanguage/skills/cleanlanguage/SKILL.md)"; then
            echo "cleanlanguage/skills/cleanlanguage/SKILL.md has no valid bare X.Y.Z 'Version:' line (see the error above)." >&2
            exit 1
          fi
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "SKILL.md version (${version}) does not match the release tag (${RELEASE_TAG})." >&2
            echo "Set the Version line in cleanlanguage/skills/cleanlanguage/SKILL.md to match the tag, or cut the matching tag." >&2
            exit 1
          fi
          # The orchestrator flips the site to name this version after the release,
          # reading main's SKILL.md as authoritative. Require the version bump to
          # be on main ALREADY (main at or ahead of this version), so a release
          # whose bump has not landed fails HERE, before anything is published,
          # rather than publishing and then stranding an unmergeable site flip.
          git fetch --quiet origin main
          # Read main's version through the same shared strict extractor. The raw
          # blob is piped straight in: skill-version.py reads all of stdin, so git
          # show completes and can take no SIGPIPE on a large blob.
          if ! main_version="$(git show FETCH_HEAD:cleanlanguage/skills/cleanlanguage/SKILL.md | python3 tools/skill-version.py)"; then
            echo "Could not read a valid bare X.Y.Z version on main." >&2
            exit 1
          fi
          higher="$(printf '%s\n%s\n' "${main_version}" "${version}" | sort -V | tail -1)"
          if [ "${main_version}" != "${version}" ] && [ "${higher}" = "${version}" ]; then
            echo "main names version ${main_version}, older than the release ${version}." >&2
            echo "Merge the ${version} version bump to main before tagging." >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "Releasing version ${version} as ${RELEASE_TAG}."

      - name: Determine the expected release date
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Item 26 (G3): the SKILL.md Released line must name the UTC day the
          # release is first published, and that is checked BEFORE anything is
          # published. A new release (HTTP 404) is published today, so the
          # expected date is the UTC day now, read once here. An existing
          # release (HTTP 200: a re-run) keeps its first
          # publication day, so the expected date is the UTC day of its
          # published_at, interpreted only by tools/skill-release-date.py
          # --published-day, the one place that states the assumption about
          # that field. Any other status fails closed. The packager compares
          # this date with the Released line at HEAD. This probe duplicates the
          # one in the publish step on purpose (one purpose each), and the
          # publish step re-checks the UTC day immediately before it creates a
          # release and reads the publication day back afterwards.
          #
          # An undated release (no Released line, at or below the undated
          # baseline) checks no date at all, exactly as before item 26:
          # RELEASE_DATED=0 skips this probe, the packager date check, the
          # publication-window check, and the publication-day half of the
          # readback. Item 57: the publish step still requires the release to
          # read back as immutable on every path that ends the run green,
          # dated or not.
          #
          # Every call to the extractor tells its own content verdicts (exit 1
          # malformed, 3 absent, 4 unreadable) apart from the extractor being
          # unavailable or crashed (2, 6 for an internal error, 127, anything
          # else), and the probe below runs first so a broken extractor is
          # never read as a content verdict.
          release_date_tool_failed() { # exit-code what
            echo "tools/skill-release-date.py is unavailable or crashed (exit $1) while $2, so the release date cannot be checked." >&2
            exit 1
          }
          prc=0
          baseline="$(python3 tools/skill-release-date.py --baseline)" || prc=$?
          if [ "${prc}" -ne 0 ] || ! printf '%s' "${baseline}" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            release_date_tool_failed "${prc}" "probing it"
          fi
          rc=0
          python3 tools/skill-release-date.py cleanlanguage/skills/cleanlanguage/SKILL.md >/dev/null || rc=$?
          case "${rc}" in
            0) dated=1 ;;
            3)
              rc=0
              requirement="$(python3 tools/skill-release-date.py --requires-date "${VERSION}")" || rc=$?
              case "${rc}" in
                0) ;;
                1) echo "tools/skill-release-date.py rejected the version ${VERSION} (see the error above)." >&2; exit 1 ;;
                *) release_date_tool_failed "${rc}" "deciding whether ${VERSION} needs a Released line" ;;
              esac
              case "${requirement}" in
                optional) dated=0 ;;
                # The line is required; the packager refuses its absence.
                required) dated=1 ;;
                *) echo "tools/skill-release-date.py gave an unexpected answer (${requirement:-nothing}) for ${VERSION}." >&2; exit 1 ;;
              esac
              ;;
            1) echo "The Released line in cleanlanguage/skills/cleanlanguage/SKILL.md is malformed (see the error above)." >&2; exit 1 ;;
            4) echo "Could not read cleanlanguage/skills/cleanlanguage/SKILL.md for its Released line (see the error above)." >&2; exit 1 ;;
            *) release_date_tool_failed "${rc}" "reading the Released line of cleanlanguage/skills/cleanlanguage/SKILL.md" ;;
          esac
          if [ "${dated}" -eq 0 ]; then
            echo "RELEASE_DATED=0" >> "${GITHUB_ENV}"
            echo "RELEASE_DATE=" >> "${GITHUB_ENV}"
            echo "SKILL.md ${VERSION} carries no Released line and is at or below the undated baseline ${baseline}; no release date is checked."
            exit 0
          fi
          response="$(mktemp)"
          set +e
          gh api --include --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >"${response}" 2>&1
          set -e
          status="$(awk '$1 ~ /^HTTP\/[0-9.]+$/ { code=$2 } END { print code }' "${response}")"
          rm -f "${response}"
          case "${status}" in
            404)
              release_date="$(date -u +%F)"
              ;;
            200)
              if ! published_at="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .published_at)"; then
                echo "Could not read published_at for the existing release ${RELEASE_TAG}." >&2
                exit 1
              fi
              rc=0
              release_date="$(python3 tools/skill-release-date.py --published-day "${published_at}")" || rc=$?
              case "${rc}" in
                0) ;;
                1)
                  echo "The published_at of ${RELEASE_TAG} (${published_at:-empty}) is not a usable UTC instant (see the error above)." >&2
                  exit 1
                  ;;
                *) release_date_tool_failed "${rc}" "reading the published_at of ${RELEASE_TAG}" ;;
              esac
              ;;
            *)
              echo "Could not determine whether ${RELEASE_TAG} is already published (HTTP ${status:-none}), so its release date is unknown." >&2
              echo "Refusing to proceed rather than check the Released line against a guess." >&2
              exit 1
              ;;
          esac
          echo "RELEASE_DATED=1" >> "${GITHUB_ENV}"
          echo "RELEASE_DATE=${release_date}" >> "${GITHUB_ENV}"
          echo "Expected release date ${release_date} (UTC) for ${RELEASE_TAG}."

      - name: Validate, package, and verify the skill zip
        shell: bash
        run: |
          set -euo pipefail
          # The packager always refuses a malformed Released line, and a
          # missing one above the undated baseline; --release-date also
          # requires the line to be present, at any version, and to name the
          # expected day, so an undated release (RELEASE_DATED=0) is packaged
          # without it.
          if [ "${RELEASE_DATED}" = "1" ]; then
            tools/release-package.sh --tag "${RELEASE_TAG}" --release-date "${RELEASE_DATE}"
          else
            tools/release-package.sh --tag "${RELEASE_TAG}"
          fi

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          # Item 26 (G3) helpers. The publication-window check is used only
          # for a dated release (RELEASE_DATED=1): check_publish_window
          # refuses to start publishing unless the UTC clock, read at the
          # call, is still on the day RELEASE_DATE with at least 10 minutes
          # left before UTC midnight (tools/skill-release-date.py
          # --publish-window decides that).
          release_date_tool_failed() { # exit-code what
            echo "tools/skill-release-date.py is unavailable or crashed (exit $1) while $2." >&2
            exit 1
          }
          refuse_publish_window() {
            echo "Refusing to publish ${RELEASE_TAG}: its Released line (${RELEASE_DATE}) would not name the UTC day the release is published (see the reason above). No release was created." >&2
            echo "The tag ${RELEASE_TAG} may already be on origin at ${built_commit}: a tag push started this run, or a dispatch pushed it before this check. To recover, first land a commit on main that re-stamps the Released line (and the renderings) for the UTC day you will publish on, then do one of these:" >&2
            echo "  - delete the remote tag (git push origin --delete refs/tags/${RELEASE_TAG}) and release again, either by pushing ${RELEASE_TAG} at the new commit or by dispatching this workflow from main with tag ${RELEASE_TAG};" >&2
            echo "  - or dispatch this workflow from main with tag ${RELEASE_TAG} and the force input; with no published release, force only moves the unpublished tag to the new commit." >&2
            exit 1
          }
          check_publish_window() {
            local rc=0
            python3 tools/skill-release-date.py --publish-window "${RELEASE_DATE}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >/dev/null || rc=$?
            case "${rc}" in
              0) ;;
              5) refuse_publish_window ;;
              1) echo "The expected release date ${RELEASE_DATE} or the clock reading is malformed (see the error above)." >&2; exit 1 ;;
              *) release_date_tool_failed "${rc}" "checking the publication window" ;;
            esac
          }
          # confirm_published_release is the publication readback. It runs on
          # EVERY path that ends a release run successfully, dated or not:
          # after the first creation and on a re-run at the same commit, so a
          # retry cannot turn a failed readback green. It requires the release
          # record to be immutable (immutable exactly true), so its
          # published_at cannot be replaced later, and then, for a dated
          # release only, requires the UTC day of its published_at to be the
          # Released day, decided only by tools/skill-release-date.py
          # --confirm-published. An undated release (RELEASE_DATED=0) has no
          # Released day, so its readback ends after the immutable check
          # (item 57). The log line it prints after the first creation of a
          # dated release is the first-publication
          # observation that tools/check-release-checksum-live.py defers to.
          # This readback is the only immutability check. The repository
          # setting that makes new releases immutable is deliberately not
          # read beforehand: GitHub documents its REST endpoint as needing
          # administration read access, which the workflow GITHUB_TOKEN cannot
          # be granted, so such a pre-check would refuse every release
          # (tools/test-release-skill-workflow.py fails if the workflow names
          # that endpoint). The readback fails closed: an unreadable, missing
          # (null), empty or any other non-true immutable value refuses the
          # run. A release published while the setting is off is already
          # public when this refuses, and every re-run refuses it the same way.
          confirm_published_release() { # label
            local immutable published_at rc=0
            if ! immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .immutable)"; then
              echo "::error::Release ${RELEASE_TAG} is published, but its immutable field could not be read back." >&2
              echo "Once the release record is readable, dispatch this workflow again with the force input unchecked and the tag ${RELEASE_TAG} itself selected as the run ref, not main, to verify the published release." >&2
              exit 1
            fi
            if [ "${immutable}" != "true" ]; then
              echo "::error::Release ${RELEASE_TAG} is published, but its immutable field reads ${immutable:-empty}, not true, so its published_at could later be replaced and cannot be relied on." >&2
              echo "Turn on immutable releases for the repository, then cut a corrective new version." >&2
              exit 1
            fi
            if [ "${RELEASE_DATED}" != "1" ]; then
              echo "$1: release ${RELEASE_TAG} is immutable; it carries no Released line, so no publication day is checked."
              return 0
            fi
            if ! published_at="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .published_at)"; then
              echo "::error::Release ${RELEASE_TAG} is published, but its published_at could not be read back, so its publication day is unconfirmed against Released: ${RELEASE_DATE}." >&2
              echo "Once the release record is readable, dispatch this workflow again with the force input unchecked and the tag ${RELEASE_TAG} itself selected as the run ref, not main, to verify the published release." >&2
              exit 1
            fi
            echo "$1: release ${RELEASE_TAG} published_at ${published_at:-empty}."
            python3 tools/skill-release-date.py --confirm-published "${RELEASE_DATE}" "${published_at}" >/dev/null || rc=$?
            case "${rc}" in
              0) echo "Release ${RELEASE_TAG} was published on ${RELEASE_DATE} (UTC), the day its Released line names." ;;
              5)
                echo "::error::Release ${RELEASE_TAG} IS PUBLISHED on a different UTC day from its Released line: Released ${RELEASE_DATE}, published_at ${published_at} (see the days above)." >&2
                echo "The published zip carries Released: ${RELEASE_DATE}, and an immutable release cannot be republished, so the remedy is a corrective new version whose Released line names its own publication day; tools/check-release-checksum-live.py reports the same disagreement until then." >&2
                exit 1
                ;;
              1)
                echo "::error::Release ${RELEASE_TAG} is published, but its published_at (${published_at:-empty}) is not a usable UTC instant, so its publication day is unconfirmed against Released: ${RELEASE_DATE}." >&2
                exit 1
                ;;
              *) release_date_tool_failed "${rc}" "confirming the publication day of ${RELEASE_TAG}" ;;
            esac
          }
          # Item 26: for a dated release, probe the extractor first, as every
          # other caller does, so a missing or broken extractor is reported as
          # that, never read as a verdict on the clock or the release record.
          if [ "${RELEASE_DATED}" = "1" ]; then
            prc=0
            baseline="$(python3 tools/skill-release-date.py --baseline)" || prc=$?
            if [ "${prc}" -ne 0 ] || ! printf '%s' "${baseline}" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
              release_date_tool_failed "${prc}" "probing it"
            fi
          fi
          # The commit we built and will publish. Normalize GITHUB_SHA to a
          # commit id: a pushed annotated tag can set GITHUB_SHA to the tag
          # object rather than the commit, and every tag comparison below then
          # uses this peeled commit, so a legitimate annotated-tag release is
          # not refused as a mismatch.
          built_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          # A published release is immutable and its checksum is a trust
          # signal, so its bytes never change: a bad release is corrected by
          # a new version, never in place, and the force input is refused
          # against it. Probe the release through the API so a transient
          # error fails closed rather than reading as "no release".
          response="$(mktemp)"
          set +e
          gh api --include --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >"${response}" 2>&1
          set -e
          # --silent drops the body, so only headers are scanned; match a real
          # status line and keep the last one, after any redirects.
          status="$(awk '$1 ~ /^HTTP\/[0-9.]+$/ { code=$2 } END { print code }' "${response}")"
          rm -f "${response}"
          case "${status}" in
            200) release_exists=1 ;;
            404) release_exists=0 ;;
            *)
              echo "Could not determine whether ${RELEASE_TAG} is already published (HTTP ${status:-none})." >&2
              echo "Refusing to proceed rather than act on a release whose state is unknown." >&2
              exit 1
              ;;
          esac
          # Resolve the remote tag on its own, preferring the peeled commit
          # line (^{}) explicitly so an annotated tag resolves to its commit
          # regardless of output order. Tag moves are governed independently.
          remote_tag_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" "refs/tags/${RELEASE_TAG}" | awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { plain=$1 } END { print (peeled != "" ? peeled : plain) }')"
          if [ "${release_exists}" -eq 1 ]; then
            if [ "${FORCE}" = "true" ]; then
              echo "Refusing the force input: release ${RELEASE_TAG} is already published, and an immutable release cannot be republished." >&2
              echo "The force input only moves the tag of a release that is not yet published. The remedy for a published release is a corrective new version." >&2
              echo "To verify the published release instead, dispatch this workflow again with the force input unchecked and the tag ${RELEASE_TAG} itself selected as the run ref, not main." >&2
              exit 1
            fi
            if [ "${remote_tag_sha}" = "${built_commit}" ]; then
              # A re-run at the same commit. The published assets are immutable,
              # so keep them; but prove the published release is COMPLETE and
              # SELF-CONSISTENT before the run ends. Each zip is bound to its
              # checksum by hashing the download DIRECTLY, and each manifest must
              # be exactly one 64-hex digest and the matching basename, so a
              # crafted path inside a downloaded manifest cannot redirect the
              # check at another file. The published checksum, not a fresh local
              # build, is authoritative, so a runner-image zip/zlib change
              # between the original release and this re-run cannot false-fail.
              published_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
              # grep -q exits on its first match, so a here-string (not a printf
              # pipe) avoids a SIGPIPE that set -o pipefail would turn into a
              # present asset reported as missing on a long asset list.
              for asset in cleanlanguage.zip cleanlanguage.zip.sha256 "cleanlanguage-${VERSION}.zip" "cleanlanguage-${VERSION}.zip.sha256"; do
                grep -qxF -- "${asset}" <<< "${published_assets}" || {
                  echo "Published release ${RELEASE_TAG} is missing the asset ${asset}." >&2
                  echo "A published release is immutable and cannot be completed in place; cut a corrective new version." >&2
                  exit 1
                }
              done
              verify_dir="$(mktemp -d)"
              trap 'rm -rf "${verify_dir}"' EXIT
              gh release download "${RELEASE_TAG}" --dir "${verify_dir}" --clobber \
                --pattern "cleanlanguage.zip" \
                --pattern "cleanlanguage.zip.sha256" \
                --pattern "cleanlanguage-${VERSION}.zip" \
                --pattern "cleanlanguage-${VERSION}.zip.sha256"
              verify_published_asset() {
                zip="$1"; manifest="$2"
                # The manifest must be EXACTLY one line: a 64-hex digest, the two
                # spaces sha256sum writes, and the expected basename, nothing
                # more. mapfile counts every line, so a trailing blank line or a
                # second line is rejected, and the exact-string test rejects any
                # trailing data after the name.
                mapfile -t mlines < "${verify_dir}/${manifest}"
                [ "${#mlines[@]}" -eq 1 ] \
                  || { echo "Manifest ${manifest} is not exactly one line." >&2; return 1; }
                claimed="${mlines[0]%%  *}"
                printf '%s' "${claimed}" | grep -Eqx '[0-9a-f]{64}' \
                  || { echo "Manifest ${manifest} carries no valid sha256 digest." >&2; return 1; }
                [ "${mlines[0]}" = "${claimed}  ${zip}" ] \
                  || { echo "Manifest ${manifest} is not exactly '<digest>  ${zip}'." >&2; return 1; }
                computed="$(sha256sum "${verify_dir}/${zip}" | cut -d' ' -f1)"
                [ "${computed}" = "${claimed}" ] \
                  || { echo "Published ${zip} (${computed}) does not match its published checksum (${claimed})." >&2; return 1; }
                return 0
              }
              verify_published_asset cleanlanguage.zip cleanlanguage.zip.sha256 \
                || { echo "The published release ${RELEASE_TAG} fails verification against its own published checksums. A published release is immutable and cannot be republished; cut a corrective new version." >&2; exit 1; }
              verify_published_asset "cleanlanguage-${VERSION}.zip" "cleanlanguage-${VERSION}.zip.sha256" \
                || { echo "The published release ${RELEASE_TAG} fails verification against its own published checksums. A published release is immutable and cannot be republished; cut a corrective new version." >&2; exit 1; }
              cmp -s "${verify_dir}/cleanlanguage.zip" "${verify_dir}/cleanlanguage-${VERSION}.zip" \
                || { echo "The published stable and version-named zips of ${RELEASE_TAG} differ. A published release is immutable and cannot be republished; cut a corrective new version." >&2; exit 1; }
              rm -rf "${verify_dir}"; trap - EXIT
              # Item 26 (G3), item 57: a re-run ends green only on the same
              # readback as the first publication, dated or not.
              confirm_published_release "Re-run readback"
              echo "Release ${RELEASE_TAG} is already published at ${built_commit}, complete and self-consistent; kept its assets. The orchestrator flips the site checksum post-release."
              exit 0
            else
              echo "Release ${RELEASE_TAG} is already published, but its tag now resolves to ${remote_tag_sha:-nothing}, not ${built_commit}." >&2
              echo "Republishing different bytes under a published version would break its checksum as a trust signal." >&2
              echo "A published release is immutable, with or without the force input; cut a corrective new version." >&2
              exit 1
            fi
          fi
          if [ "${release_exists}" -eq 0 ] && [ "${RELEASE_DATED}" = "1" ]; then
            # Item 26 (G3): an early window check, before any tag operation,
            # so a run that is already too late does not push a tag it cannot
            # use. The binding window check is the one immediately before the
            # create call.
            check_publish_window
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -z "${remote_tag_sha}" ]; then
              git tag "${RELEASE_TAG}" "${built_commit}"
              git push origin "refs/tags/${RELEASE_TAG}"
            elif [ "${remote_tag_sha}" = "${built_commit}" ]; then
              echo "Tag ${RELEASE_TAG} already points at ${built_commit}; leaving it in place."
            elif [ "${FORCE}" = "true" ]; then
              echo "force is enabled; moving ${RELEASE_TAG} to ${built_commit}."
              git tag -f "${RELEASE_TAG}" "${built_commit}"
              git push --force origin "refs/tags/${RELEASE_TAG}"
            else
              echo "Tag ${RELEASE_TAG} already points at ${remote_tag_sha}, not ${built_commit}; refusing to move it without the force input." >&2
              exit 1
            fi
          else
            # Tag push: the tag must still resolve to the built commit, or a
            # concurrent move would publish one commit's bytes under another.
            if [ "${remote_tag_sha}" != "${built_commit}" ]; then
              echo "Tag ${RELEASE_TAG} resolves to ${remote_tag_sha:-nothing} on origin, not the built commit ${built_commit}; refusing to publish mismatched bytes." >&2
              exit 1
            fi
          fi
          # Only a new release reaches this point: every published-release
          # branch above has exited. There is no upload path for an existing
          # release, because a published release is immutable.
          if [ "${RELEASE_DATED}" = "1" ]; then
            # Item 26 (G3): the binding publication-window check, after every
            # tag operation and immediately before the create call, so the
            # tag push cannot carry the run past UTC midnight unchecked. The
            # 10-minute margin covers the create call and its asset uploads;
            # the readback below confirms the day that GitHub recorded.
            check_publish_window
          fi
          gh release create "${RELEASE_TAG}" --verify-tag \
            dist/cleanlanguage.zip \
            dist/cleanlanguage.zip.sha256 \
            "dist/cleanlanguage-${VERSION}.zip" \
            "dist/cleanlanguage-${VERSION}.zip.sha256" \
            --title "Clean Language ${RELEASE_TAG}" \
            --generate-notes
          # Item 26 (G3), item 57: the first-publication readback, dated or
          # not.
          confirm_published_release "First-publication readback"

      # No site step follows. Publishing the release is this workflow's last act.
      # The site's published-checksum flip is performed by the orchestrator out
      # of band, under a user token, after this run completes: matching the rest
      # of the fleet, no workflow in this repository opens or merges a pull
      # request from the GitHub Actions identity. A future editor must not re-add
      # an Actions step that runs `gh pr create` or `gh pr merge`; the built-in
      # token is blocked from it by policy, and the fleet keeps PR authorship in
      # the orchestrator. See the orchestrator's release runbook for the exact
      # post-release site steps.
