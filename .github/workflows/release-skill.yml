name: Release Clean Language Skill

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v1.0.2"
        required: true
        type: string
      force:
        description: "Overwrite an already published release and move its tag to this commit. This changes published bytes and checksums; leave it unchecked. To finish a partly failed release, re-run this workflow with the tag itself selected as the run ref, not main."
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  # tools/ci-status.sh reads the Check Runs API on the site pull request.
  checks: read

concurrency:
  # Serialize releases for a tag so two runs cannot interleave the tag, the
  # release, and the site steps. A release in progress is never cancelled.
  group: release-skill-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the site pull request step runs check-page-metadata.py
          # before opening the PR, and that check reads each page's history.
          fetch-depth: 0

      - name: Read and validate the version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' cleanlanguage/SKILL.md | head -1)"
          if [ -z "${version}" ]; then
            echo "No 'Version:' line found in the cleanlanguage/SKILL.md body." >&2
            exit 1
          fi
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "SKILL.md version (${version}) does not match the release tag (${RELEASE_TAG})." >&2
            echo "Set the Version line in cleanlanguage/SKILL.md to match the tag, or cut the matching tag." >&2
            exit 1
          fi
          # The release flips the site to name this version, and the site step
          # reads main's SKILL.md as authoritative. Require the version bump to
          # be on main ALREADY (main at or ahead of this version), so a release
          # whose bump has not landed fails HERE, before anything is published,
          # rather than publishing and then stranding an unmergeable site flip.
          git fetch --quiet origin main
          main_version="$(git show FETCH_HEAD:cleanlanguage/SKILL.md \
            | sed -n 's/^Version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' | head -1)"
          [ -n "${main_version}" ] || { echo "Could not read the version on main." >&2; exit 1; }
          higher="$(printf '%s\n%s\n' "${main_version}" "${version}" | sort -V | tail -1)"
          if [ "${main_version}" != "${version}" ] && [ "${higher}" = "${version}" ]; then
            echo "main names version ${main_version}, older than the release ${version}." >&2
            echo "Merge the ${version} version bump to main before tagging." >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "${GITHUB_ENV}"
          echo "Releasing version ${version} as ${RELEASE_TAG}."

      - name: Validate, package, and verify the skill zip
        shell: bash
        run: tools/release-package.sh --tag "${RELEASE_TAG}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail
          # The commit we built and will publish. Normalise GITHUB_SHA to a
          # commit id: a pushed annotated tag can set GITHUB_SHA to the tag
          # object rather than the commit, and every tag comparison below then
          # uses this peeled commit, so a legitimate annotated-tag release is
          # not refused as a mismatch.
          built_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          # A published release is immutable: its checksum is a trust signal,
          # so its bytes never change except by a deliberate manual dispatch
          # with the force input. Probe the release through the API so a
          # transient error fails closed rather than reading as "no release".
          response="$(mktemp)"
          set +e
          gh api --include --silent "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >"${response}" 2>&1
          set -e
          # --silent drops the body, so only headers are scanned; match a real
          # status line and keep the last one, after any redirects.
          status="$(awk '$1 ~ /^HTTP\/[0-9.]+$/ { code=$2 } END { print code }' "${response}")"
          rm -f "${response}"
          case "${status}" in
            200) release_exists=1 ;;
            404) release_exists=0 ;;
            *)
              echo "Could not determine whether ${RELEASE_TAG} is already published (HTTP ${status:-none})." >&2
              echo "Refusing to proceed rather than risk overwriting a published release." >&2
              exit 1
              ;;
          esac
          # Resolve the remote tag on its own, preferring the peeled commit
          # line (^{}) explicitly so an annotated tag resolves to its commit
          # regardless of output order. Tag moves are governed independently.
          remote_tag_sha="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" "refs/tags/${RELEASE_TAG}" | awk '$2 ~ /\^\{\}$/ { peeled=$1 } $2 !~ /\^\{\}$/ { plain=$1 } END { print (peeled != "" ? peeled : plain) }')"
          if [ "${release_exists}" -eq 1 ]; then
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${FORCE}" = "true" ]; then
              echo "force is enabled; overwriting the published release ${RELEASE_TAG}."
            elif [ "${remote_tag_sha}" = "${built_commit}" ]; then
              # A re-run at the same commit. The published assets are immutable,
              # so keep them; but prove the published release is COMPLETE and
              # SELF-CONSISTENT, then take its PUBLISHED checksum so the site
              # shows exactly what a downloader gets. Each zip is bound to its
              # checksum by hashing the download DIRECTLY, and each manifest must
              # be exactly one 64-hex digest and the matching basename, so a
              # crafted path inside a downloaded manifest cannot redirect the
              # check at another file. The published checksum, not a fresh local
              # build, is authoritative, so a runner-image zip/zlib change
              # between the original release and this re-run cannot false-fail.
              published_assets="$(gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name')"
              for asset in cleanlanguage.zip cleanlanguage.zip.sha256 "cleanlanguage-${VERSION}.zip" "cleanlanguage-${VERSION}.zip.sha256"; do
                printf '%s\n' "${published_assets}" | grep -qx "${asset}" || {
                  echo "Published release ${RELEASE_TAG} is missing the asset ${asset}." >&2
                  echo "Republish deliberately with a manual dispatch and the force input." >&2
                  exit 1
                }
              done
              verify_dir="$(mktemp -d)"
              trap 'rm -rf "${verify_dir}"' EXIT
              gh release download "${RELEASE_TAG}" --dir "${verify_dir}" --clobber \
                --pattern "cleanlanguage.zip" \
                --pattern "cleanlanguage.zip.sha256" \
                --pattern "cleanlanguage-${VERSION}.zip" \
                --pattern "cleanlanguage-${VERSION}.zip.sha256"
              verify_published_asset() {
                zip="$1"; manifest="$2"
                [ "$(grep -c . "${verify_dir}/${manifest}")" = "1" ] \
                  || { echo "Manifest ${manifest} is not a single line." >&2; return 1; }
                claimed="$(awk 'NF{print $1; exit}' "${verify_dir}/${manifest}")"
                named="$(awk 'NF{print $2; exit}' "${verify_dir}/${manifest}")"
                printf '%s' "${claimed}" | grep -Eqx '[0-9a-f]{64}' \
                  || { echo "Manifest ${manifest} carries no valid sha256 digest." >&2; return 1; }
                [ "${named}" = "${zip}" ] \
                  || { echo "Manifest ${manifest} names ${named}, not ${zip}." >&2; return 1; }
                computed="$(sha256sum "${verify_dir}/${zip}" | cut -d' ' -f1)"
                [ "${computed}" = "${claimed}" ] \
                  || { echo "Published ${zip} (${computed}) does not match its published checksum (${claimed})." >&2; return 1; }
                return 0
              }
              verify_published_asset cleanlanguage.zip cleanlanguage.zip.sha256 \
                || { echo "The published release ${RELEASE_TAG} is corrupt or was partly overwritten; republish deliberately with a manual dispatch and the force input." >&2; exit 1; }
              verify_published_asset "cleanlanguage-${VERSION}.zip" "cleanlanguage-${VERSION}.zip.sha256" \
                || { echo "The published release ${RELEASE_TAG} is corrupt or was partly overwritten; republish deliberately with a manual dispatch and the force input." >&2; exit 1; }
              cmp -s "${verify_dir}/cleanlanguage.zip" "${verify_dir}/cleanlanguage-${VERSION}.zip" \
                || { echo "The published stable and version-named zips of ${RELEASE_TAG} differ." >&2; exit 1; }
              # Show the PUBLISHED checksum on the site: replace the fresh local
              # manifests with the validated published ones.
              cp "${verify_dir}/cleanlanguage.zip.sha256" dist/cleanlanguage.zip.sha256
              cp "${verify_dir}/cleanlanguage-${VERSION}.zip.sha256" "dist/cleanlanguage-${VERSION}.zip.sha256"
              rm -rf "${verify_dir}"; trap - EXIT
              echo "Release ${RELEASE_TAG} is already published at ${built_commit}, complete and self-consistent; kept its assets and took its published checksum. Continuing to the site step."
              exit 0
            else
              echo "Release ${RELEASE_TAG} is already published, but its tag now resolves to ${remote_tag_sha:-nothing}, not ${built_commit}." >&2
              echo "Republishing different bytes under a published version would break its checksum as a trust signal." >&2
              echo "Cut a new version, or run this workflow manually with the force input to overwrite ${RELEASE_TAG} deliberately (select the tag as the run ref)." >&2
              exit 1
            fi
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -z "${remote_tag_sha}" ]; then
              git tag "${RELEASE_TAG}" "${built_commit}"
              git push origin "refs/tags/${RELEASE_TAG}"
            elif [ "${remote_tag_sha}" = "${built_commit}" ]; then
              echo "Tag ${RELEASE_TAG} already points at ${built_commit}; leaving it in place."
            elif [ "${FORCE}" = "true" ]; then
              echo "force is enabled; moving ${RELEASE_TAG} to ${built_commit}."
              git tag -f "${RELEASE_TAG}" "${built_commit}"
              git push --force origin "refs/tags/${RELEASE_TAG}"
            else
              echo "Tag ${RELEASE_TAG} already points at ${remote_tag_sha}, not ${built_commit}; refusing to move it without the force input." >&2
              exit 1
            fi
          else
            # Tag push: the tag must still resolve to the built commit, or a
            # concurrent move would publish one commit's bytes under another.
            if [ "${remote_tag_sha}" != "${built_commit}" ]; then
              echo "Tag ${RELEASE_TAG} resolves to ${remote_tag_sha:-nothing} on origin, not the built commit ${built_commit}; refusing to publish mismatched bytes." >&2
              exit 1
            fi
          fi
          if [ "${release_exists}" -eq 1 ]; then
            gh release upload "${RELEASE_TAG}" \
              dist/cleanlanguage.zip \
              dist/cleanlanguage.zip.sha256 \
              "dist/cleanlanguage-${VERSION}.zip" \
              "dist/cleanlanguage-${VERSION}.zip.sha256" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" --verify-tag \
              dist/cleanlanguage.zip \
              dist/cleanlanguage.zip.sha256 \
              "dist/cleanlanguage-${VERSION}.zip" \
              "dist/cleanlanguage-${VERSION}.zip.sha256" \
              --title "Clean Language ${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Point the site downloads at this release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The site's download buttons serve the version-named zip so repeat
          # downloads stay distinguishable in the user's Downloads folder. Main
          # only accepts changes through a pull request, so the redirect flip
          # ships as a PR this step opens and merges once the checks pass.
          # Store a token with contents and pull-requests write access as the
          # RELEASE_PR_TOKEN secret; without it the step falls back to the
          # built-in token, whose PRs do not trigger pull_request workflows, so
          # the site gates are run inline below before the PR opens; the
          # required Cloudflare Pages check still runs on the PR either way.
          # The branch is based on the CURRENT origin/main, not the tag commit,
          # so the PR carries only the redirect flip and never reverts changes
          # that landed on main after the tag was cut.
          git fetch origin main
          main_ref="$(git rev-parse FETCH_HEAD)"
          main_version="$(git show "${main_ref}:cleanlanguage/SKILL.md" \
            | sed -n 's/^Version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' | head -1)"
          # If main already names a newer release, this older run must not roll
          # the site back to its version; leave the newer links in place.
          if [ -n "${main_version}" ] && [ "${main_version}" != "${VERSION}" ]; then
            higher="$(printf '%s\n%s\n' "${main_version}" "${VERSION}" | sort -V | tail -1)"
            if [ "${higher}" = "${main_version}" ]; then
              echo "main already names ${main_version}, newer than ${VERSION}; leaving the site unchanged."
              exit 0
            fi
          fi
          branch="release-redirects-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${branch}" "${main_ref}"
          checksum="$(cut -d' ' -f1 < "dist/cleanlanguage-${VERSION}.zip.sha256")"
          # One UTC date drives both the page stamps and the site commit, so a
          # release crossing midnight cannot stamp one date and commit the next,
          # which would fail the page-metadata gate on the pull request.
          site_date="$(date -u +%F)"
          tools/set-release-links.py --version "${VERSION}" --tag "${RELEASE_TAG}" --checksum "${checksum}" --date "${site_date}"
          # Every gate the site pull request would trigger, run inline: a
          # built-in-token PR does not fire pull_request workflows, so this is
          # the only run that sees the flipped content before it merges.
          tools/check-release-links.py
          python3 tools/check-page-metadata.py
          python3 tools/check-links.py
          python3 tools/check-install-page.py
          if git diff --quiet -- site; then
            echo "main already points at ${RELEASE_TAG}; nothing to change."
            exit 0
          fi
          git add site
          GIT_AUTHOR_DATE="${site_date}T12:00:00Z" GIT_COMMITTER_DATE="${site_date}T12:00:00Z" \
            git commit -m "Point the site downloads at ${RELEASE_TAG}"
          git push --force origin "HEAD:${branch}"
          head_sha="$(git rev-parse HEAD)"
          repo_owner="${GITHUB_REPOSITORY%%/*}"
          # Reuse an open pull request only if it is OURS: same repository owner.
          # A fork PR sharing the head branch name has a different head-repository
          # owner, so it is never selected. The exact head commit is enforced at
          # merge time by --match-head-commit rather than by filtering on
          # headRefOid here, because the API can still report the pre-push head
          # for a moment right after the force-push, which would make a genuine
          # re-run miss its own open PR and then fail to create a duplicate.
          pr_url="$(gh pr list --head "${branch}" --base main --state open \
            --json url,headRepositoryOwner \
            --jq "[.[] | select(.headRepositoryOwner.login == \"${repo_owner}\")][0].url // empty")"
          if [ -z "${pr_url}" ]; then
            pr_url="$(gh pr create --base main --head "${branch}" \
              --title "Point the site downloads at ${RELEASE_TAG}" \
              --body "Automated for the ${RELEASE_TAG} release: the download buttons, the redirects, and the published checksum on the verify page now name the ${RELEASE_TAG} assets.")"
            echo "Opened ${pr_url}"
          else
            echo "Reusing the open pull request ${pr_url}."
          fi
          sleep 20
          tools/ci-status.sh "${head_sha}" --wait --repo "${GITHUB_REPOSITORY}"
          # --match-head-commit refuses the merge if the branch head moved since
          # the checks were validated, so only the exact reviewed commit lands.
          gh pr merge "${pr_url}" --squash --delete-branch --match-head-commit "${head_sha}"
          echo "Merged ${pr_url}"