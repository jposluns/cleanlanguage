name: Release checksum live

# The machine-visible completion signal for a release. The release workflow
# publishes the assets and stops; the orchestrator flips the site checksum out
# of band under a user token (see the release runbook), matching the rest of the
# fleet, which keeps pull request authorship out of GitHub Actions. This
# checks-only workflow goes red if the verify page checksum does not match the
# published release asset, so a forgotten or wrong flip cannot ship green and
# stay wrong. It authors nothing: read-only, no pull request, no push. The daily
# schedule runs the gate on main whatever changed, so a forgotten flip that
# produced no further push to main goes red at the next scheduled run, and the
# gate's report in the log names each reason. The path filters under push and
# pull_request name every file the gate or its tests read, and WorkflowPathsTest
# in tools/test-release-checksum-live.py pins both lists. See
# tools/check-release-checksum-live.py for exactly what it proves, and its Exit
# codes entries for each condition that turns it red and its code.

on:
  push:
    branches:
      - main
    paths:
      - "site/verify/index.html"
      - "cleanlanguage/skills/cleanlanguage/SKILL.md"
      - "tools/check-release-checksum-live.py"
      - "tools/test-release-checksum-live.py"
      - "tools/skill-release-date.py"
      - "tools/check-release-links.py"
      - "tools/build-site.py"
      - ".github/workflows/release-checksum-live.yml"
      - "site-src/**"
      - "cleanlanguage/skills/cleanlanguage/references/**"
      - "site/downloads/**"
      - "site/assets/baseline/**"
      - "site/_headers"
      - "site/_redirects"
      - "site/robots.txt"
      - "site/sitemap.xml"
      - "site/.well-known/**"
      - "site/README.md"
      - "site/images/**"
      - ".baseline/pin.toml"
      - "tools/sitemap-config.json"
      - "tools/check-install-page.py"
  pull_request:
    paths:
      - "site/verify/index.html"
      - "cleanlanguage/skills/cleanlanguage/SKILL.md"
      - "tools/check-release-checksum-live.py"
      - "tools/test-release-checksum-live.py"
      - "tools/skill-release-date.py"
      - "tools/check-release-links.py"
      - "tools/build-site.py"
      - ".github/workflows/release-checksum-live.yml"
      - "site-src/**"
      - "cleanlanguage/skills/cleanlanguage/references/**"
      - "site/downloads/**"
      - "site/assets/baseline/**"
      - "site/_headers"
      - "site/_redirects"
      - "site/robots.txt"
      - "site/sitemap.xml"
      - "site/.well-known/**"
      - "site/README.md"
      - "site/images/**"
      - ".baseline/pin.toml"
      - "tools/sitemap-config.json"
      - "tools/check-install-page.py"
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run the live checksum gate tests
        shell: bash
        run: python3 -I tools/test-release-checksum-live.py
      - name: Verify the site checksum matches the published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 -I tools/check-release-checksum-live.py
