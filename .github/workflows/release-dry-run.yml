name: Release dry run

# Proves the local, side-effect-free part of the release path without publishing: packaging, the site
# rewrite, the date stamps, and the gates the post-release site pull request
# must pass. Everything runs inside a throwaway git worktree via
# tools/release-dry-run.sh. This workflow holds read-only permissions, keeps
# no credentials after checkout, uses no secrets, and pushes, tags, releases,
# and merges nothing.
#
# It runs on the runner's python3. The first step after the checkout runs
# tools/check-python-version.py, which, on Python 3.7 or later, exits 3 unless
# that python3 is the release that .python-version names. The two page checks
# that the dry run runs load tools/check-inline-code.py and exit 3 on a Python
# version that the gate does not support: from 3.7 on for the instructions page
# check, and from 3.9 on for the install page check.
#
# This workflow carries no paths filter on purpose: the dry run and its gates
# read files across the repository, the whole site included, and a path list
# cannot be kept complete against those reads (row 127). So it runs on every
# pull request and every push to main. tools/test-portable-text-sync-workflow.py
# fails if a filter or any other narrowing comes back under either trigger, or
# if the job loses its time limit; workflow-isolation.yml runs that test on
# every pull request, so a filter that a pull request's own files fall outside
# is still caught.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    # A hung step ends the job here instead of holding the runner until the
    # platform's default job limit (row 117). Every step after the checkout
    # works on the repository's files, in the checkout, in temporary worktrees
    # made from it and in temporary directories, and the tools the steps run
    # make no network call through urllib.request, requests, socket, curl,
    # wget, gh, or git fetch, clone, pull or ls-remote. The version-consumer
    # tests bound each packager run they make at 60 seconds, so a normal run
    # should take a few minutes; 30 minutes leaves wide room for a slow
    # runner. The value is an estimate, not a measured run time: revise it
    # once real run times are known.
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the dry run runs check-page-metadata.py, which reads
          # when each page was added and last changed.
          fetch-depth: 0
          # The dry run needs no credentials after checkout, so none are kept.
          persist-credentials: false

      - name: Check that python3 is the release that .python-version names
        shell: bash
        run: python3 -I tools/check-python-version.py

      - name: Cross-consumer version-parse contract
        shell: bash
        run: python3 -I tools/test-skill-version-consumers.py

      - name: Released-line extractor contract
        shell: bash
        run: python3 -I tools/test-skill-release-date.py

      - name: Released-line client contract
        shell: bash
        run: python3 -I tools/test-skill-release-date-client.py

      - name: Release workflow date-check behaviour
        shell: bash
        run: python3 -I tools/test-release-skill-workflow.py

      - name: Version-selector contract
        shell: bash
        run: bash tools/test-version-selectors.sh

      - name: Run the release dry run
        shell: bash
        run: tools/release-dry-run.sh
