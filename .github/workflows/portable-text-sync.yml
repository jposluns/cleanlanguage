name: Portable text sync

# Two related checks on the portable instructions text.
#
# The first flags when the packaged skill changes without the portable text at
# the size-labelled portable renderings (generated cleanlanguage.md and its
# byte-equal 29k twin, and the hand-maintained 11k and 8k) being reconciled with
# the skill. See
# tools/check-portable-text-sync.sh for what it does and does not prove.
#
# The second checks that site/instructions/index.html still embeds that text
# exactly, and that it carries no inline script or style. The page renders the
# text statically because the site's own pages must not use inline code; the
# security policy allows inline scripts, so a browser would not block one, and
# site-hardening.yml checks every page for inline code as well.
#
# The paths filters list every file the steps are known to read, directly and
# through the scripts they run, copy or load (row 119). The test
# tools/test-portable-text-sync-workflow.py holds the same list with the line
# that reads each entry, derives the copies and loads it can from the step
# sources, and fails when the lists drift; extend the filters and that test in
# the same change. That test names what it cannot see: a read it cannot
# derive, and a module file that a launch without -I in the shell scripts can
# import from its module path. This workflow is not a
# required check; if it is promoted to one, drop the pull_request filter and
# give the job a unique display name, as manifest-icon.yml does and
# sitemap.yml explains. Checkout attributes are an input too: a .gitattributes
# file anywhere can change the bytes git writes for the compared files, so
# both forms are listed.

on:
  pull_request:
    paths:
      - "cleanlanguage/skills/cleanlanguage/SKILL.md"
      - "cleanlanguage/skills/cleanlanguage/references/**"
      - "cleanlanguage/skills/**"
      - "site/downloads/cleanlanguage.md"
      - "site/downloads/cleanlanguage-29k.md"
      - "site/downloads/cleanlanguage-11k.md"
      - "site/downloads/cleanlanguage-8k.md"
      - "site/downloads/*.md"
      - "tools/build-portable-text.py"
      - "tools/build-site.py"
      - "tools/sitemap-config.json"
      - "site-src/**"
      - ".baseline/pin.toml"
      - "site/instructions/index.html"
      - "tools/portable-text-skill-source.sha256"
      - "tools/skill-version.py"
      - "tools/skill-release-date.py"
      - "tools/test-skill-release-date.py"
      - "tools/skill-release-date-client.py"
      - "tools/test-skill-release-date-client.py"
      - "tools/check-release-checksum-live.py"
      - "tools/test-portable-text-release-date.sh"
      - "tools/check-portable-text-sync.sh"
      - "tools/check-instructions-page.py"
      - "tools/check-inline-code.py"
      - "tools/test-instructions-page.py"
      - "tools/test-portable-text-sync-workflow.py"
      - ".gitattributes"
      - "**/.gitattributes"
      - ".github/workflows/portable-text-sync.yml"
  push:
    branches:
      - main
    paths:
      - "cleanlanguage/skills/cleanlanguage/SKILL.md"
      - "cleanlanguage/skills/cleanlanguage/references/**"
      - "cleanlanguage/skills/**"
      - "site/downloads/cleanlanguage.md"
      - "site/downloads/cleanlanguage-29k.md"
      - "site/downloads/cleanlanguage-11k.md"
      - "site/downloads/cleanlanguage-8k.md"
      - "site/downloads/*.md"
      - "tools/build-portable-text.py"
      - "tools/build-site.py"
      - "tools/sitemap-config.json"
      - "site-src/**"
      - ".baseline/pin.toml"
      - "site/instructions/index.html"
      - "tools/portable-text-skill-source.sha256"
      - "tools/skill-version.py"
      - "tools/skill-release-date.py"
      - "tools/test-skill-release-date.py"
      - "tools/skill-release-date-client.py"
      - "tools/test-skill-release-date-client.py"
      - "tools/check-release-checksum-live.py"
      - "tools/test-portable-text-release-date.sh"
      - "tools/check-portable-text-sync.sh"
      - "tools/check-instructions-page.py"
      - "tools/check-inline-code.py"
      - "tools/test-instructions-page.py"
      - "tools/test-portable-text-sync-workflow.py"
      - ".gitattributes"
      - "**/.gitattributes"
      - ".github/workflows/portable-text-sync.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the path filters list every input the steps read
        shell: bash
        run: python3 -I tools/test-portable-text-sync-workflow.py

      - name: Test the Released-line extractor
        shell: bash
        run: python3 -I tools/test-skill-release-date.py

      - name: Test the Released-line client
        shell: bash
        run: python3 -I tools/test-skill-release-date-client.py

      - name: Test the Released-line checks in the sync gate
        shell: bash
        run: bash tools/test-portable-text-release-date.sh

      - name: Check the portable text is reconciled with the skill
        shell: bash
        run: tools/check-portable-text-sync.sh

      - name: Run the instructions page gate tests
        shell: bash
        run: python3 -I tools/test-instructions-page.py

      - name: Check the instructions page embeds that text, statically
        shell: bash
        run: python3 -I tools/check-instructions-page.py
