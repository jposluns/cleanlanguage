name: Portable text sync

# Three related checks on the portable instructions text.
#
# The first flags when the packaged skill changes without the portable text at
# the size-labelled portable renderings (generated cleanlanguage.md and its
# byte-equal 29k twin, and the hand-maintained 11k and 8k) being reconciled with
# the skill. See
# tools/check-portable-text-sync.sh for what it does and does not prove.
#
# The second checks that site/instructions/index.html still embeds that text
# exactly, and that it carries no inline script or style. The page renders the
# text statically because the site's own pages must not use inline code; the
# security policy allows inline scripts, so a browser would not block one, and
# site-hardening.yml checks every page for inline code as well.
#
# The third checks that the dash bullet of the quality checklist, one of the
# references that text carries, reads exactly as the check builds it: a fixed
# opening sentence, then "Keep a dash only in" and the list in one bullet of
# SKILL.md, the bullet in Preserve legitimate language that lists quoted
# language. It reads no other carve-out SKILL.md states. See
# tools/check-skill-consistency.py for what else it does not prove.
#
# This workflow carries no paths filter on purpose, so it runs on every pull
# request and every push to main (row 119). The steps read files across the
# repository, through the scripts they run and the files those scripts copy and
# load, and a path list cannot be kept complete against those reads. As
# sitemap.yml explains, running on every pull request also keeps this gate
# promotable to a required check; to promote it, first give the job a unique
# display name, as manifest-icon.yml does. The second step after checkout runs
# tools/test-portable-text-sync-workflow.py, which fails if a paths or
# paths-ignore filter comes back on either trigger. workflow-isolation.yml,
# which carries no paths filter either, runs it too, so a pull request that
# adds a filter here which its own changed files fall outside still runs it.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check that python3 is the release that .python-version names
        shell: bash
        run: python3 -I tools/check-python-version.py

      - name: Check neither trigger carries a path filter
        shell: bash
        run: python3 -I tools/test-portable-text-sync-workflow.py

      - name: Test the Released-line extractor
        shell: bash
        run: python3 -I tools/test-skill-release-date.py

      - name: Test the Released-line client
        shell: bash
        run: python3 -I tools/test-skill-release-date-client.py

      - name: Test the Released-line checks in the sync gate
        shell: bash
        run: bash tools/test-portable-text-release-date.sh

      - name: Check the portable text is reconciled with the skill
        shell: bash
        run: tools/check-portable-text-sync.sh

      - name: Test the skill consistency gate
        shell: bash
        run: python3 -I tools/test-check-skill-consistency.py

      - name: Check that the checklist dash bullet matches the skill carve-out bullet
        shell: bash
        run: python3 -I tools/check-skill-consistency.py

      - name: Run the instructions page gate tests
        shell: bash
        run: python3 -I tools/test-instructions-page.py

      - name: Check the instructions page embeds that text, statically
        shell: bash
        run: python3 -I tools/check-instructions-page.py
