name: Link check

# Two link checks.
#
# The first verifies that internal links resolve: root-relative and
# document-relative href/src in the site HTML, and relative Markdown link targets
# in the tracked docs. See tools/check-links.py for scope.
#
# The second verifies that every release-asset link on the site names the version
# in SKILL.md, and that the checksum shown on the verify page is well formed and
# labelled with that version. The site links straight at release assets, so the
# version lives in the pages and goes stale on every release. A stale link still
# returns a file, just the wrong one, which no other check would notice.
#
# The second check also holds the verify page to the page tools/build-site.py
# renders, so the paths below include every input of the generator and the
# generator itself: site-src/**, .baseline/pin.toml, tools/sitemap-config.json,
# tools/build-site.py, and the files under site/ and the Markdown it reads.

on:
  pull_request:
    paths:
      - "site/**"
      - "site-src/**"
      - "*.md"
      - ".claude/**/*.md"
      - "cleanlanguage/**/*.md"
      - ".baseline/pin.toml"
      - "tools/build-site.py"
      - "tools/sitemap-config.json"
      - "tools/check-links.py"
      - "tools/check-release-links.py"
      - "tools/set-release-links.py"
      - "tools/test-release-links.py"
      - ".github/workflows/link-check.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "site-src/**"
      - "*.md"
      - ".claude/**/*.md"
      - "cleanlanguage/**/*.md"
      - ".baseline/pin.toml"
      - "tools/build-site.py"
      - "tools/sitemap-config.json"
      - "tools/check-links.py"
      - "tools/check-release-links.py"
      - "tools/set-release-links.py"
      - "tools/test-release-links.py"
      - ".github/workflows/link-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check internal links resolve
        shell: bash
        run: python3 -I tools/check-links.py

      - name: Run the release-links gate tests
        shell: bash
        run: python3 -I tools/test-release-links.py

      - name: Check release links name the current version
        shell: bash
        run: python3 -I tools/check-release-links.py
