name: Orchestration registry

# Validate .aiqt/orchestration.json structural integrity. The AIQT orchestration hooks
# read this file and classify it "ok" only when it is a JSON object whose version is the
# integer 1. A "bad" registry keeps the write-scope companion exemption empty (writes
# deny, which is fail-safe), but the scope-gated guards react divergently: orch_stop_guard
# fails open with a warning, orch_dispatch_ledger silently allows without recording, and
# orch_yield_tool fails closed (it denies a scheduling call, so a bad registry blocks
# scheduling even with no lease or mode). This gate rejects a structurally invalid committed
# registry before it lands, so a corrupt registry cannot reach a session.
#
# The stage-2 steps test the project backlog enumerator and the one-shot TODO.md migration
# script, then drive the real hook with each stage-2 arming key against a contrast without
# that key, together with the project orch_doctor tool. Each is its own named step, so a run
# that omits one is visible in the step list, not only in the overall colour. A lint step fails
# when a comment or docstring in these sources, the workflows, the 2 launch scans or the release
# sources names a review round or a finding id instead of stating its reason, and when any line
# of a file under tools/, site-src/ or .github/ names a review pass or a finding by number
# (tools/test-no-qa-labels.py). A further step runs a literal regression check
# of the /flow command's mode text, since a session follows /flow when it reads the host's mode
# record (tools/check-flow-mode.py). It fails when the file does not hold exactly 1 line starting
# "- MODE (", when that line is not closed on the same line or does not name exactly the 2 values
# that the host's mode writer writes, each once and in lower case, when any line holds a bare
# "attended" outside the text between straight double quotes that the check pairs left to right
# on that line, or when the sentence that an absent mode record is read as unattended is missing.
# It reads words, not meaning: outside the MODE line, the bare "attended" test is the only test
# that can fail a line, so a third mode value named there, such as "supervised", passes, and one
# that holds a bare "attended", such as "attended-only", fails; only the bare "attended" test skips
# quoted text; a line that closes a quotation wrapped from the line above
# pairs that closing quote with the next opening quote, so a bare "attended" between them passes;
# a sentence that contradicts the absent rule passes, so does that sentence negated or inside a
# quotation that rejects it; and the absent rule stated in other words fails. The step after it
# runs a case for each of those verdicts (tools/test-check-flow-mode.py).
#
# Every Python launch runs isolated (-I), as every hook launch in hooks.json does, so a file
# beside a script cannot shadow a standard library import and no PYTHON* environment variable
# steers the run. tools/test-orchestration-registry.py checks this file for the flag.
#
# This workflow carries no paths filter on purpose. A path-filtered required check never
# reports on a pull request outside its paths and blocks the merge as forever-pending;
# running on every pull request keeps this gate promotable to a required check later. The
# run needs no git history, so the checkout stays shallow.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate the orchestration registry
        shell: bash
        run: python3 -I tools/check-orchestration-registry.py

      - name: Run the orchestration-registry gate tests
        shell: bash
        run: python3 -I tools/test-orchestration-registry.py

      - name: Check the orchestration sources for review-history labels
        shell: bash
        run: python3 -I tools/test-no-qa-labels.py

      - name: Run the stage-1 hook behaviour tests
        shell: bash
        run: python3 -I tools/test-orch-stage1-hooks.py

      - name: Run the backlog enumerator tests
        shell: bash
        run: python3 -I tools/test-orch-enumerate-backlog.py

      - name: Run the TODO.md migration tests
        shell: bash
        run: python3 -I tools/test-orch-migrate-todo.py

      - name: Run the stage-2 hook behaviour and doctor tests
        shell: bash
        run: python3 -I tools/test-orch-stage2-hooks.py

      - name: Run the repository AskUserQuestion guard tests
        shell: bash
        run: python3 -I tools/test-ask-mode-guard.py

      - name: Check /flow's mode text for a regression to the retired mode words
        shell: bash
        run: python3 -I tools/check-flow-mode.py

      - name: Run the /flow mode check tests
        shell: bash
        run: python3 -I tools/test-check-flow-mode.py

      # Re-run the gate against the committed registry by its explicit path, so this step is RED both on
      # a malformed edit and (via the gate tests above, which assert the arming keys are present) on a
      # tree that lacks the stage-1 arming change.
      - name: Validate the committed orchestration registry explicitly
        shell: bash
        run: python3 -I tools/check-orchestration-registry.py .aiqt/orchestration.json
