name: Orchestration registry

# Validate .aiqt/orchestration.json structural integrity. The AIQT orchestration hooks
# read this file and classify it "ok" only when it is a JSON object whose version is the
# integer 1. A "bad" registry keeps the write-scope companion exemption empty (writes
# deny, which is fail-safe), but the scope-gated guards react divergently: orch_stop_guard
# fails open with a warning, orch_dispatch_ledger silently allows without recording, and
# orch_yield_tool fails closed (it denies a scheduling call, so a bad registry blocks
# scheduling even with no lease or mode). This gate rejects a structurally invalid committed
# registry before it lands, so a corrupt registry cannot reach a session.
#
# The stage-2 steps test the project backlog enumerator and the one-shot TODO.md migration
# script, then drive the real hook with each stage-2 arming key against a contrast without
# that key, together with the project orch_doctor tool, and feed the vendored gate_weakening hook
# write-then-run commit probes held as JSON payload data (tools/test-gate-weakening-probes.py),
# which it must deny. Each is its own named step, so a run
# that omits one is visible in the step list, not only in the overall colour. A lint step
# fails when a comment or docstring in these sources, the workflows, the 2 launch scans,
# tools/check-release-checksum-live.py, tools/test-release-checksum-live.py or
# tools/test-skill-release-date.py names a review round or a finding id instead of stating
# its reason, and when a line of a tracked file under tools/, site-src/ or .github/ matches
# one of the history patterns that the lint lists, such as the word round or rounds, in any
# case, then any run of hyphens or white space, or none, an optional number sign and a
# number, exempt where a letter or a decimal continuation follows as the lint states, the
# word finding or findings, in any case, 1 space, an optional number sign and a digit, or
# DISCOVERY or VERIFY in capitals, then optionally 1 space and the word round or rounds in
# lower case, then a hyphen or 1 space, an optional number sign and a digit, or one of the 2
# backlog probes, read case-insensitively with their words separated by 1 space, apart from
# the fixture lines of the lint itself, the lines of its marked fixture assignments that hold
# no comment; a line of such an assignment that holds a comment is read, comment included,
# and one that holds any other token of a statement, such as a semicolon or a second
# statement, fails; a line that names a review pass or a finding by number in a phrasing, or
# with a separator before its number, that no history pattern matches passes, such as
# finding-3 or VERIFY3 (tools/test-no-qa-labels.py). A further step runs a literal regression
# check of the /flow command's mode text and of 7 of its rule paragraphs, since a session
# follows /flow when it reads the host's mode record and when it runs its QA cycle
# (tools/check-flow-mode.py). It fails when the file does not hold exactly 1 line starting
# "- MODE (", when that line is not closed on the same line or does not name exactly the 2
# values that the host's mode writer writes, each 1 time and in lower case, when any line
# holds a bare "attended" outside the text between straight double quotes that the check
# pairs left to right on that line, when the sentence that an absent mode record is read as
# unattended is missing, or when any of the 7 pinned paragraphs (the header, the cycle steps,
# the seeding paragraph, FAILED LEG, the CODEX ROLE LIMIT, the tiers paragraph and VERIFIER
# DIVERSITY) is not found once or differs from the sha256 that the check holds for it in
# anything but the white space between its words or after its last word, inside its opening
# text too; a blank line put inside 1 of them fails too, though it changes only white space.
# So every edit of those 7 paragraphs that changes more than that white space fails this
# step. When the paragraph is still found once, the report gives the 1-line update of its
# sha256 in the check, which clears only that report; an edit of its opening text needs the
# row's opening text and sha256 rewritten. It reads words, not meaning: outside the 7 pinned
# paragraphs an edit fails only when a mode test fails, as on a line that starts "- MODE ("
# or holds a bare "attended", when a paragraph there starts with the opening text of a pinned
# paragraph, when a pinned paragraph joins the text beside it, or when the text is not UTF-8,
# so the bullet "- A third mode, supervised, is also read." passes there, and the same bullet
# naming "attended-only", which holds a bare "attended", fails; only the bare "attended" test
# skips quoted text; a line that closes a quotation wrapped from the line above pairs that
# closing quote with the next opening quote, so a bare "attended" between them passes; a
# sentence that contradicts the absent rule passes, so does that sentence negated or inside a
# quotation that rejects it; and the absent rule stated in other words fails. Any other edit
# outside the 7 paragraphs passes. The step after it, tools/test-check-flow-mode.py, runs a
# case for each of those verdicts.
#
# A further step (tools/test-no-worker-identifiers.py) reads every candidate address around
# every at sign of the stored blob of each tracked entry, which the index names and git cat-file
# gives, never the working copy, and of each tracked path name. 2 exemptions, each tested on
# a candidate folded to lower case: (1) the candidate is exactly the maintainer's address; (2)
# the domain of the candidate is reserved for documentation: its last label is invalid, test, or
# example, or it is, or ends with a dot and then, example.com, example.org, or example.net. An
# at sign passes only when every candidate that the scan reads at it is exempt, under either
# exemption, or when it lies in a file on a line that the reviewed exact-line allowlist holds
# for that file; a path name has no allowlist. So an address at mail.corp.example.com fails,
# since mail.corp is not reserved. Only a hit in the content of a file names a line: the file,
# the line number, and a digest of the match. A hit in a path name names no line, only a digest
# of the path name and of the match; a stale allowlist entry names its file, its position, and a
# digest of its text; and a fail-closed failure names no line and no digest of a match. No
# failure holds the text of a match, and a path whose name holds a match is named only by a
# digest of the path name.
#
# Every Python launch runs isolated (-I), as every hook launch in hooks.json does, so a file
# beside a script cannot shadow a standard library import and no PYTHON* environment variable
# steers the run. tools/test-orchestration-registry.py checks this file for the flag.
#
# This workflow carries no paths filter on purpose. A path-filtered required check never
# reports on a pull request outside its paths and blocks the merge as forever-pending;
# running on every pull request keeps this gate promotable to a required check later. The
# run needs no git history, so the checkout stays shallow.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate the orchestration registry
        shell: bash
        run: python3 -I tools/check-orchestration-registry.py

      - name: Run the orchestration-registry gate tests
        shell: bash
        run: python3 -I tools/test-orchestration-registry.py

      - name: Check the scanned sources and tools/, site-src/ and .github/ for review-history labels
        shell: bash
        run: python3 -I tools/test-no-qa-labels.py

      - name: Check every tracked file and the whole name of every tracked path for a worker or third-party email address
        shell: bash
        run: python3 -I tools/test-no-worker-identifiers.py

      - name: Run the stage-1 hook behaviour tests
        shell: bash
        run: python3 -I tools/test-orch-stage1-hooks.py

      - name: Run the backlog enumerator tests
        shell: bash
        run: python3 -I tools/test-orch-enumerate-backlog.py

      - name: Run the TODO.md migration tests
        shell: bash
        run: python3 -I tools/test-orch-migrate-todo.py

      - name: Run the stage-2 hook behaviour and doctor tests
        shell: bash
        run: python3 -I tools/test-orch-stage2-hooks.py

      - name: Run the gate_weakening write-then-run probe tests
        shell: bash
        run: python3 -I tools/test-gate-weakening-probes.py

      - name: Run the repository AskUserQuestion guard tests
        shell: bash
        run: python3 -I tools/test-ask-mode-guard.py

      - name: Check /flow's mode text and its 7 pinned rule paragraphs for a literal regression
        shell: bash
        run: python3 -I tools/check-flow-mode.py

      - name: Run the /flow mode check tests
        shell: bash
        run: python3 -I tools/test-check-flow-mode.py

      # Re-run the gate against the committed registry by its explicit path, so this step is RED both on
      # a malformed edit and (via the gate tests above, which assert the arming keys are present) on a
      # tree that lacks the stage-1 arming change.
      - name: Validate the committed orchestration registry explicitly
        shell: bash
        run: python3 -I tools/check-orchestration-registry.py .aiqt/orchestration.json
