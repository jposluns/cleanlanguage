# Security-floor reductions the re-vendor carries, each authorized by the maintainer and
# pinned by a regression probe. A row that is not authorized blocks merge (gate-discipline).
id = "W1"
rule = "trkasy"
hook = "orch_truncation_guard"
summary = "an ampersand in a quoted-delimiter heredoc body fed to a shell is lifted by the lexer narrowing (_ORCH_AMP_PLACES), so a backgrounded command in such a body is a silent allow"
decision = "accept, plus a local compensating hook (maintainer decision OP2; date recorded at finalization)"
decision-id = "maintainer decision 2026-10-30: accept with a local compensating hook (private record store)"
compensating-control = "the adopter-owned PreToolUse Bash hook .claude/hooks/shell_heredoc_detach_guard.py, registered in .claude/settings.json and tested by tools/test-shell-heredoc-detach-guard.py (a named step of the Orchestration registry workflow); its disclosed residual, quoted from the hook docstring: RESIDUAL (disclosed; this guard is best-effort and does not cover every way to detach a child): 1. Interpreter recognition is by the written command word only. A shell reached through a variable (such as SHELL), an alias or function, another wrapper (sudo, nohup, nice, timeout, xargs, setsid, ssh, busybox), another shell name (ash, mksh, yash), a subshell group as a later pipeline stage, a group or subshell that carries the here-document, a process substitution, or eval, source or the dot command reading the body is not seen. 2. Detachers that carry no single ampersand (setsid, nohup without one, disown, coproc, a nested bash -c string inside the body) are not seen. 3. The lexer is a best-effort reading of bash, not a guarantee: case patterns inside a command substitution, extended globs, single quotes inside a parameter expansion within double quotes, ANSI-C escapes and arithmetic can be read differently from bash. A misreading can hide an ampersand (a silent allow) or invent one (an over-refusal). 4. Inside a command substitution or backquotes a body ends at a line that starts with the delimiter followed by a closing parenthesis, as bash 5.3 reads it; an older bash reads further lines as body, and an ampersand in those lines is not judged. 5. Over-refusal: a shell-fed here-document is denied whatever the shell arguments, so bash -c with a command string, bash with a script operand, and a here-document on a descriptor other than 0 are denied when the body holds a backgrounding ampersand, although that body is then not read as commands. The remedy is to run the job in the foreground or through the tracked background dispatch. 6. An unreadable hook payload (not JSON, or no command string) is allowed with a note; the vendored trkasy guard denies such a payload. 7. The vendored lexer adds denies only; where it is absent, renamed or refuses a body, coverage rests on this file lexer alone (noted on each such call)."
probe = "tools/test-shell-heredoc-detach-guard.py"
status = "accepted"

[[weakenings]]
id = "W2"
rule = "cmtidn"
hook = "commit_identity"
summary = "commands longer than 128 KiB are judged by _commit_identity_fallback; a command of tens of MiB may outlast the 10-second hook timeout and run with no deny"
decision = "accept with disclosure, plus a regression probe (maintainer decision OP3; date recorded at finalization)"
decision-id = "maintainer decision 2026-10-30: accept with a regression probe (private record store)"
compensating-control = "none mechanical beyond the probe; the root CLAUDE.md attribution rule and the repository identity configuration (.aiqt/config.md) stay in force"
probe = "tools/test-cmtidn-large-message.py: a git commit command of about 200 KiB whose message carries an AI co-author trailer, once at its start and once past the 128 KiB read limit, is denied by the vendored hook, and controls of the same length with no trailer or a human trailer are allowed; a named step of the Orchestration registry workflow"
status = "accepted"

[notes]
decided-points = "OP4: the upstream LICENSE and NOTICE at source-commit are vendored byte for byte as .aiqt/LICENSE and .aiqt/NOTICE, mapped to their upstream paths by [[vendor.relocated]] and verified by the vendor gate. OP5: no CI egress; vendor gate check 7 runs locally against the pack checkout, as a QA-worker and pre-merge step, not in CI"
in-force = "the hook carries a 128 KiB commit-identity read limit (W2) and refuses to run below Python 3.14 (FLOOR_FAIL_OPEN_MODES exit 0, every other mode exits 2)"
