# AIQT Guardrails adoption pin
#
# Records exactly what was vendored so the official pack release (v1.1.0, the
# "development assistant", in development) can recognize and advance this install.
# See ../maintainer-decisions.md, the recon at aiqt-guardrails-recon-2026-09-05.md
# in the durable store, and NOTICE.md. Adopter-owned files (this pin, config.md,
# and anything under .claude/rules/external/) are never overwritten by an update.
#
# DRAFT (items 38 and 40, whole-subset re-vendor at 466a519b850d9ae4e64ba1f2a8cbcd81771c66d2).
# Not yet authorized to land: the [[weakenings]] rows below still carry placeholders for
# their decision ids and status. OP4 and OP5 are decided (see [notes]). Remove this block
# when the draft is finalized.

[source]
name = "aiqt-guardrails"
homepage = "https://aiqt.ai"
license = "Apache-2.0"  # LICENSE at source-commit is the Apache License 2.0 (sha256 in [vendor] license-sha256); the v1.0.0 adoption source was CC-BY-SA-4.0, and the pack was relicensed by the author (Elastic License 2.0 at tag v1.0.5 c5d77b0, Apache 2.0 from eeba6d1, 2026-09-20)
author = "Jeff Posluns"
vendored-from = "/opt/guardrails/guardrails"   # local pack checkout
source-commit = "466a519b850d9ae4e64ba1f2a8cbcd81771c66d2"  # full commit, never a tag or branch name
source-date = "2026-10-30T03:03:04-04:00"  # committer date of source-commit
source-ref = "origin/main of the local pack checkout at its fetch of 2026-10-30 07:31:43 UTC"
adopted = "2026-09-05"
revendored = "PLACEHOLDER: the merge date of the re-vendor PR"

[version]
# The source pack versions these three independently. The maintainer intent
# (2026-09-05) is that the pack and skill versions be unified; that reconciliation
# is upstream in the pack. The tree-sha256 below is the pack digest over its full source
# tree at source-commit, so it identifies the source revision; the per-file hashes in
# .aiqt/manifest.toml and in [vendor] below are what pin the adopted subset.
pack = "1.0.5"          # VERSION and manifest.toml release-version at source-commit
skill = "1.0.6"         # .aiqt/core/skill/skill-source.md meta version at source-commit
hooks-plugin = "0.4.0"  # plugin/aiqt-guardrails-hooks/.claude-plugin/plugin.json (bytes unchanged since 2eb6812)

[integrity]
tree-sha256 = "90717703652dba780e92f90d4d48b32b079b374418c6d4bb02bec72fa82eb14e"
root = "sha256:e5a226c25dd013307f3f4f4e7f4e2a1a43fbc323900a10f3977c8c4e29587e51"
manifest = ".aiqt/manifest.toml"
# The manifest is the upstream generated file at source-commit, byte for byte, and is no
# longer hand-edited. tools/check-aiqt-vendor.py verifies the vendored files against it and
# it against this pin (checks 1 to 6); check 7 (--upstream) re-derives every vendored file
# from the pack at source-commit. History: at adoption (2026-09-05) all 125 rule files and
# the applicability files matched their recorded hashes in the v1.0.0 manifest (codex
# assessment, 2026-09-05).

[vendored]
# Partial vendor: the rule corpus, the hooks plugin, provenance metadata, and the pack
# licence and notice (relocated from the pack root; see [[vendor.relocated]]).
# The pack generators, standards manifests, gates, and skill build are NOT adopted.
paths = [
  ".aiqt/LICENSE",
  ".aiqt/NOTICE",
  ".aiqt/core/rules",
  ".aiqt/core/applies.toml",
  ".aiqt/core/applicability.toml",
  ".aiqt/core/ownership.toml",
  ".aiqt/core/order.toml",
  ".aiqt/manifest.toml",
  ".aiqt/release/root.txt",
  "plugin/aiqt-guardrails-hooks",
  ".claude/rules/aiqt",
  ".claude/rules/security",
]

[active-rules]
# Auto-loaded subset. Profile C: applicable to this project, minus low-value rules.
# The six rules new at source-commit (attint, citint, cntprd, kltwat, rvwpin, tmrrst) each
# apply under a condition this profile has on (applies.toml at source-commit), and none is
# excluded, so active rises from 107 to 113 and the corpus from 126 to 132.
profile = "coding + agent-harness + multi-agent, personal-data off"
active = 113
excluded = 19   # 9 app-security-no-surface, 5 personal-data, 1 atomic-claim-from-pool, 4 code-idiom
corpus = ".aiqt/core/rules"
trees = [".claude/rules/aiqt", ".claude/rules/security"]
excluded-ids = [
  "atmclm",
  "cmpmig",
  "mindep",
  "mtchcd",
  "secau1",
  "secazn",
  "secdrr",
  "secfid",
  "seckey",
  "seclpr",
  "secmin",
  "secpur",
  "secred",
  "secspr",
  "secssr",
  "secsyn",
  "sectok",
  "secupl",
  "tsthrm",
]
basis = "codex applicability assessment + fable value ranking, 2026-09-05 (see durable store); exclusions unchanged by the whole-subset advance (maintainer decision OP1)"

