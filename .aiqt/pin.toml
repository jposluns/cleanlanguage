# AIQT Guardrails adoption pin
#
# Records exactly what was vendored so the official pack release (v1.1.0, the
# "development assistant", in development) can recognize and advance this install.
# See ../maintainer-decisions.md, the recon at aiqt-guardrails-recon-2026-09-05.md
# in the durable store, and NOTICE.md. Adopter-owned files (this pin, config.md,
# and anything under .claude/rules/external/) are never overwritten by an update.

[source]
name = "aiqt-guardrails"
homepage = "https://aiqt.ai"
license = "CC-BY-SA-4.0"
author = "Jeff Posluns"
vendored-from = "/opt/guardrails/guardrails"   # local pack checkout at adoption time
adopted = "2026-09-05"

[version]
# The source pack versions these three independently. The maintainer's intent
# (2026-09-05) is that the pack and skill versions be unified; that reconciliation
# is upstream in the pack. The tree-sha256 below is the pack's digest over its full v1.0.0 source tree, so it
# identifies the source RELEASE; the per-file hashes in .aiqt/manifest.toml are what pin
# the adopted subset. Both are recorded regardless of the version label.
pack = "1.0.0"          # VERSION, changelog.toml, manifest.toml release-version
skill = "1.0.4"         # .aiqt/core/skill/skill-source.md meta.version
hooks-plugin = "0.4.0"  # plugin/aiqt-guardrails-hooks/.claude-plugin/plugin.json

[integrity]
tree-sha256 = "9dbbe17c9bb1372b0bff9b01216d6860851d7b735983a0c40691d91329ca1fe4"
root = "sha256:3b2b345e02c4e41845b7f59e28bc0a49a283ec6a06394c9933d536474d299f58"
manifest = ".aiqt/manifest.toml"
# Verified at adoption: all 125 rule files and the applicability files matched
# their recorded hashes in the v1.0.0 manifest (codex assessment, 2026-09-05).

[vendored]
# Partial vendor: the rule corpus, the hooks plugin, and provenance metadata.
# The pack's generators, standards manifests, gates, and skill build are NOT adopted.
paths = [
  ".aiqt/core/rules",
  ".aiqt/core/applies.toml",
  ".aiqt/core/applicability.toml",
  ".aiqt/core/ownership.toml",
  ".aiqt/core/order.toml",
  ".aiqt/manifest.toml",
  ".aiqt/release/root.txt",
  "plugin/aiqt-guardrails-hooks",
  ".claude/rules/aiqt",
  ".claude/rules/security",
]

[active-rules]
# Auto-loaded subset. Profile C: applicable to this project, minus low-value rules.
profile = "coding + agent-harness + multi-agent, personal-data off"
active = 107
excluded = 19   # 9 app-security-no-surface, 5 personal-data, 1 atomic-claim-from-pool, 4 code-idiom
basis = "codex applicability assessment + fable value ranking, 2026-09-05 (see durable store)"

[hooks-update]
# 2026-09-12: the enforcement hooks were advanced from the v1.0.0 baseline to guardrails
# round-2 (PR #232, merged as fa5f942) - the no-ask posture conversion plus git_discard /
# wrtscp / cnsdif hardening. This is a SCOPED, hooks-only advance: the rule corpus and
# everything else remain at v1.0.0. The [integrity] tree-sha256 above (9dbbe17c) therefore
# describes the v1.0.0 baseline and NO LONGER matches the working tree; the per-file hashes
# in .aiqt/manifest.toml (updated for the two plugin hook files) are authoritative for what
# is installed.
# 2026-09-13: reconciled aiqt_hooks.py to guardrails main (PR #233, 2eb6812) - the
# protected_line no-remote commit exemption (unblocks a local no-remote store's handoff
# commit) and the cnsdif git-show no-patch (-s/--no-patch/--stat) exemption. Verified
# byte-identical to upstream main at HEAD 0510edd (sha256 1052f4f4...), matching the upstream
# manifest. hooks.json UNCHANGED (these change hook logic, not registrations). Still a SCOPED
# hooks-only advance; the orchestrator suite stays inert (no registry). Adopted per maintainer
# decision 2026-09-13 (32-adopt, option C sequenced, Step 1). Prior advance: 2026-09-12 PR #232
# fa5f942 (round-2 hardening).
advanced = "2026-09-13"
source-commit = "2eb6812c" # guardrails main PR #233; file == upstream HEAD 0510edd
files = [
  "plugin/aiqt-guardrails-hooks/hooks/scripts/aiqt_hooks.py",  # 704505 B, sha256 1052f4f48f2fe0e839c665455ad2af2c21abf3fe389fa8acb832fcdf842062ce
  "plugin/aiqt-guardrails-hooks/hooks/hooks.json",             # 8663 B, sha256 18753794b9438846aff40658337b5a211664b2579d976df2087aea143e4d206c
]
verified = "byte-identical to the merged manifest (tri-family --expensive QA upstream); plus adopter no-ask invariant + cnsdif discrimination probes and an independent codex verifier"

[rules-update]
# 2026-09-13: added guardrails PR #205's rule "explicit-binding-over-ambient-context"
# (corpus-id expbnd, INTEG) as a SCOPED, rule-corpus-only addition. #205 is a POST-v1.0.0
# rule; its enforcement hook (git_explicit_binding) was ALREADY live here, having ridden in
# with the 2026-09-13 hooks advance above, so only the rule DOCUMENTATION and bookkeeping were
# missing. This mirrors the [hooks-update] scoped advance: the rest of the corpus stays at
# v1.0.0, the [integrity] tree-sha256 above (9dbbe17c) still describes the v1.0.0 baseline and
# does NOT match the working tree, and the per-file hashes in .aiqt/manifest.toml (updated with
# the two new rule files below, matching upstream's manifest entries) are authoritative for
# what is installed. [active-rules] active rises from 106 to 107; the full vendored corpus
# rises from 125 to 126. Vendored byte-identical to upstream main at HEAD 7c6478c.
advanced = "2026-09-13"
source-commit = "6b32434" # guardrails PR #205 (GD-157/158/159); file == upstream HEAD 7c6478c
files = [
  ".aiqt/core/rules/integ-explicit-binding-over-ambient-context.md",      # 3452 B, sha256 42fadd1cf7769a4af1114d91d461114a1859e7fc3aee1fe5feb081e33e38bd79
  ".claude/rules/aiqt/10-INTEG-explicit-binding-over-ambient-context.md", # 3452 B, sha256 42fadd1cf7769a4af1114d91d461114a1859e7fc3aee1fe5feb081e33e38bd79
]
verified = "byte-identical to upstream guardrails main at HEAD 7c6478c (source-commit 6b32434, PR #205), matching the upstream .aiqt/manifest.toml source and artifact entries; hook git_explicit_binding already live from the 2026-09-13 hooks advance"
