# .aiqt/core/applies.toml
#
# Per-rule applicability ASSIGNMENTS (GD-99): corpus-id -> the activation conditions that switch the
# rule on. Hand-authored SOURCE; the vocabulary is .aiqt/core/applicability.toml. tools/check_applies.py
# enforces bidirectional coverage: every corpus-id in the corpus has exactly one entry here, no orphan
# entry, and every condition is drawn from the vocabulary.
#
# Synthesized tri-family (claude/codex/gemini) -> Fable, then finalized at source; always subsumes
# other tags (a floor rule is in every set).

