# .aiqt/core/ownership.toml: the ANCHORED CANONICAL OWNERSHIP MAP (VER-CORE 4.2).
#
# Concern 1 (release-file inventory): every git-tracked path in the candidate release commit, MINUS the
# concrete-literal [[exclusion]] set, carries EXACTLY ONE [[release-class]] below. Scope is computed BY
# INVERSION (all tracked paths minus the exclusions); there is NO inclusion hand-list and NO default
# class: an in-scope tracked path matching no selector fails the build loud (exit 2), prompting either an
# explicit class row or a concrete exclusion line. Selectors are an exact `path` OR a literal directory
# prefix `pattern` ending in `/**`; nothing else. Selectors must be DISJOINT: two selectors matching the
# same tracked path are a schema FAIL, never a precedence pick.
#
# Concern 2 ([[namespace-class]]): adopter-created namespaces with ZERO tracked entries here, exempt from
# the concern-1 NO-STRAYS leg, and the classification authority the adopter-side verifier uses.
#
# Concern 3: the adopter-installed extent is NOT rostered here; it is defined in the adopter-experience
# spec ([adopter-extent] below is the hook).
#
# Verified by tools/gen_manifest.py and tools/check_manifest.py (schema violations are fail-closed exit 2).

format-version = 1

# --- concern-1 concrete-literal exclusion set (the ONLY hand-maintained list; visible, reviewable) -----

[[exclusion]]
path = ".gitignore"
reason = "Repository-local development metadata; tracked but not shipped."

[[exclusion]]
path = ".github/workflows/currency.yml"
reason = "CI currency workflow; tracked, not shipped. Exact literal, not a glob (F-235)."

[[exclusion]]
path = ".github/workflows/quality.yml"
reason = "CI quality workflow; tracked, not shipped. Exact literal, not a glob (F-235)."

[[exclusion]]
path = ".github/workflows/msg-leaks.yml"
reason = "CI message/metadata leak workflow; tracked, not shipped. Exact literal, not a glob (F-235)."

[[exclusion]]
path = ".github/check_newtab_contract.py"
reason = "Repository-local NEWTAB declaration-content assertion; tracked, not shipped."

[[exclusion]]
path = ".github/check_cited_standards_contract.py"
reason = "Repository-local assertion that .aiqt/cited-standards.toml keeps the rule files and every OPF prompt-pack member pack.toml lists in its corpus (pack.toml validated by opf/tools/check_opf_prompt_pack.py), and that every cited-standards gate line in both runners is exactly the permitted invocation (--config .aiqt/cited-standards.toml and nothing else); a mandatory member of tools/check_ci_parity.py, so removing it from both runners is a parity finding; tracked, not shipped."

[[exclusion]]
path = ".aiqt/newtab.toml"
reason = "Repository-local NEWTAB coverage declaration; tracked, not shipped. Adopters own their roots, like .aiqt/derived-command-parameters.toml; this tracked file belongs to concern 1, not the untracked concern-2 namespace."

[[exclusion]]
path = ".aiqt/python-host.toml"
reason = "Repository-local CI configuration: the exact CPython patch release the maintainer host runs, read by tools/check_python_host_pin.py and tools/check_python_floor.py to hold the host-patch CI jobs to it; tracked, not shipped, like .aiqt/newtab.toml. An adopter has no such jobs."

[[exclusion]]
path = ".aiqt/char-policy.json"
reason = "Repository-local character policy read by tools/check_no_dashes.py and the char-policy-write preview hook; tracked, not shipped. Adopters own their roots (an absent file applies the gate's built-in default), like .aiqt/newtab.toml; this tracked file belongs to concern 1, not the untracked concern-2 namespace."

[[exclusion]]
path = ".aiqt/cited-standards.toml"
reason = "Repository-local corpus config for tools/check_cited_standards.py, passed with --config by this repository's CI and tools/run_all_checks.sh to add the OPF prompt-pack members to the rule corpus, and pinned by .github/check_cited_standards_contract.py; tracked, not shipped. Run without --config, the gate applies its built-in default corpus (the rule files alone) and reads no default file. The shipped tools/run_all_checks.sh still passes --config, so in a tree without this file (an adopter install) its cited-standards gate exits 2 (cannot evaluate) and the runner ends RESULT: FAIL, as its newtab-repo-contract gate and its two cited-standards-repo-contract gate lines do there (their .github scripts are not shipped)."

[[exclusion]]
path = ".aiqt/license-qualification.toml"
reason = "Repository-local licence-qualification gate configuration (the declared licence identity plus the class-3 exception list) read by tools/check_license_qualification.py; tracked, not shipped. Adopters own their configuration (an absent file applies no declaration and no exceptions), like .aiqt/newtab.toml; this tracked file belongs to concern 1, not the untracked concern-2 namespace."

# The authoring-only roster (tools/gen_hooks.py AUTHORING_ONLY_REL): tracked here, never shipped. gen_manifest
# refuses either path a release class, requires both tracked together under these exact literals, and allows
# this one exclusion over a gensrc-registered kind=file target; every other gensrc target stays refused.

[[exclusion]]
path = ".claude/settings.json"
reason = "Repository-local project hook registration (the gensrc-edit-guard dogfood wiring), generated whole and drift-gated by tools/gen_hooks.py in the authoring tree only, and gensrc-registered. Tracked, never shipped, so no release, pin or install can carry it over an adopter's own project settings."

[[exclusion]]
path = ".aiqt/authoring.toml"
reason = "The authoring-tree marker tools/gen_hooks.py reads before it renders .claude/settings.json. Tracked, never shipped, so an adopter tree never carries it and an adopter run never touches its own .claude/settings.json."

# --- concern-1: manifest-self and the managed block ----------------------------------------------------

[[release-class]]
path = ".aiqt/manifest.toml"
class = "manifest-self"
note = "Excluded from its own SOURCES (the fixed point); verified against the ROOT."

[[release-class]]
path = "CLAUDE.md"
class = "managed-block"
note = "Mixed surface: only the RULES-INDEX delimited block is pack-owned; bytes outside it are adopter-owned."

# --- concern-1: derived (recomputation-verified; outside the 4.3 set-equality walk) --------------------

[[release-class]]
path = ".aiqt/release/root.txt"
class = "derived"
note = "ROOT over the manifest bytes; carved out of SOURCES (R9-6); verified by recomputation."

[[release-class]]
path = ".aiqt/release/announce-snippet.txt"
class = "derived"
note = "Regenerated from manifest plus version; carved out of SOURCES (R9-6)."

[[release-class]]
path = ".aiqt/frozen.json"
class = "derived"
note = "EN-8 write-scope frozen floor: generated by gen_manifest.py from this map's {derived, manifest-self, archive} classes (one classifier, two consumers). A SOURCES member (not carved out); self-listed on the floor (class derived), so a guarded-tool write to it is denied by write_scope_guard."

[[release-class]]
pattern = "site/downloads/**"
class = "derived"
note = "Published outputs, corpus-derived, manifest-covered in SOURCES. The machine-generated outputs are byte-identity drift-gated at source by their own gensrc drift gates. The hand-authored sized instruction condensations (aiqt-instructions-8k/5k/1_5k.txt) have no generator; tools/check_sized_instructions.py gates their character caps, version agreement (rejecting a malformed version token such as a 4th segment or a prerelease/build suffix, and treating a malformed 'Version' line beside a valid one as a fail-closed finding), and a recorded SHA-256 of the generated source, but their editorial reconciliation with that source is a maintainer --update step whose git-diff check proves only that a condensation changed versus HEAD, not that the change preserved the meaning (a whitespace-only edit passes), so semantic fidelity rests on maintainer review, not on the gate. This gate, and the sibling tools/check_install_page.py tripwire over the install page, are static checks that catch ACCIDENTAL regression by a maintainer editing the site; they are NOT adversarial-grade. A determined author can still bypass a static check by construction (for the install page, a hidden ancestor or wrapper element, exotic inline CSS hiding such as opacity:0/height:0/transform:scale(0)/clip-path, a hidden status element, or a new unguarded rule; for --update, a git-evaluation error or a semantically empty edit that passes the git-diff heuristic). That residual class is unbounded and is disclosed, not chased closed."

