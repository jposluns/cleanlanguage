class = "pack-immutable"

[[release-class]]
path = ".claude/rules/README.md"
class = "pack-immutable"
note = "Hand-authored shipped pack content, an explicit per-path entry (4.2)."

[[release-class]]
path = ".github/copilot-instructions.md"
class = "pack-immutable"

[[release-class]]
path = ".gitattributes"
class = "pack-immutable"
note = "Generated by gen_manifest.py from this map; carries its own class (bytes, not a digest of itself)."

