class = "pack-immutable"
note = "The dependency-closed OPF tooling subtree (OPF-SELF-CONTAIN). Shipped pack tooling, byte-exact, mirroring tools/**; disjoint from it. H-1 ratified: no new class family."

[[release-class]]
pattern = "opf/prompt-pack/**"
class = "pack-immutable"
note = "The OPF prompt pack (manifest and member documents), verified by opf/tools/check_opf_prompt_pack.py. Shipped pack content, byte-exact, beside opf/tools/** and opf/spec/** and disjoint from both. No new class family."

[[release-class]]
pattern = "opf/spec/**"
class = "pack-immutable"
note = "The OPF specification pair (OPF-SPEC.md, OPF-QUICKSTART.md) relocated under opf/ (OPF-SELF-CONTAIN). Shipped pack content, byte-exact. H-1 ratified: no new class family."

[[release-class]]
pattern = "opf/enforcement/**"
class = "pack-immutable"
note = "The OPF enforcement pack: adopter-installed CI, pre-commit, hook and instruction files, starting with the CI floor under ci/. Shipped pack content, byte-exact. No new class family."

[[release-class]]
pattern = ".preview/**"
class = "pack-immutable"
note = "The public hooks preview channel: standalone hook files, their README.md install page, and SHA256SUMS, byte-exact shipped content like the other top-level surfaces. Removed with the directory when the last preview hook moves into the plugin."

[[release-class]]
pattern = "docs/**"
class = "pack-immutable"
note = "Documentation Markdown sources (docs/<name>.md) and the shared shell template (docs/_shell.html) that tools/gen_site.py composes into site/<name>.html. Byte-exact shipped pack content; the site pages remain the byte-parity target of the drift gate."

